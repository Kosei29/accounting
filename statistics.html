<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#0b1220"><title>Accounting · Statistics</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1220;color:#e5e7eb}.app{min-height:100vh}.top{height:72px;border-bottom:1px solid #1f2937;background:#080d18;display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0}.brand{font-size:20px;font-weight:800}.brand span{color:#60a5fa}.back{border:0;background:#1e293b;color:#cbd5e1;padding:9px 14px;border-radius:9px;cursor:pointer;font-weight:650}.content{max-width:1250px;margin:auto;padding:30px}.intro{margin-bottom:22px}.intro h1{margin:0 0 6px;font-size:26px}.muted{color:#94a3b8;font-size:13px;line-height:1.5}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}.card,.section{background:#111a2a;border:1px solid #243047;border-radius:14px}.card{padding:19px}.label{color:#94a3b8;font-size:11px;text-transform:uppercase;letter-spacing:.08em}.value{font-size:25px;font-weight:750;margin-top:8px}.positive{color:#4ade80}.negative{color:#fb7185}.warning{color:#fbbf24}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:20px;margin-bottom:20px}.section{overflow:hidden;margin-bottom:20px}.head{padding:18px 20px;border-bottom:1px solid #243047}.head h2{margin:0;font-size:15px}.body{padding:20px}.bar{display:flex;align-items:center;gap:10px;margin:13px 0}.bar-name{width:130px;font-size:13px;overflow:hidden;text-overflow:ellipsis}.bar-track{flex:1;height:9px;background:#1f2937;border-radius:999px;overflow:hidden}.bar-fill{height:100%;background:#60a5fa;border-radius:999px}.bar-num{width:85px;text-align:right;font-size:12px;color:#cbd5e1}.hero{font-size:30px;font-weight:800;margin:5px 0 8px}.emoji{font-size:34px;margin-bottom:6px}.insight{border:1px solid #253149;background:#0d1524;border-radius:11px;padding:14px;margin-top:10px;font-size:13px;line-height:1.55}.rank{display:flex;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid #202b3e}.rank:last-child{border-bottom:0}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#1e293b;color:#cbd5e1;font-size:11px}.empty{padding:25px;text-align:center;color:#64748b}.meter{height:11px;background:#1f2937;border-radius:999px;overflow:hidden;margin:10px 0}.meter span{display:block;height:100%;background:#60a5fa}.footer{text-align:center;color:#475569;font-size:11px;padding:8px 0 30px}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:600px){.content{padding:18px}.top{padding:0 18px}.cards{grid-template-columns:1fr 1fr}.bar-name{width:95px}.bar-num{width:65px}.value{font-size:21px}}
</style>
</head>
<body>
<div class="app"><header class="top"><div class="brand">Accounting<span>.</span> <span style="color:#94a3b8;font-size:12px;font-weight:600">/ Statistics</span></div><button class="back" onclick="location.href='./'">← Back to Accounting</button></header><main class="content"><div class="intro"><h1>Your Money Story</h1><div class="muted">A little less spreadsheet, a little more detective work. These stats are calculated from your recorded transactions.</div></div><div id="app"></div><div class="footer">Statistics update automatically from the transactions stored in this browser.</div></main></div>
<script>
const money=n=>'₱'+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:0,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tx=JSON.parse(localStorage.getItem('acct_transactions')||'[]')||[];let debts=JSON.parse(localStorage.getItem('acct_debts')||'[]')||[];let accounts=JSON.parse(localStorage.getItem('acct_accounts')||'[]')||[];
const expenses=tx.filter(x=>x.type==='expense'&&x.category!=='Opening Balance');const income=tx.filter(x=>x.type==='income');const debtPayments=tx.filter(x=>x.debtId);
function sum(a){return a.reduce((s,x)=>s+Number(x.amount||0),0)}
function byCategory(){const m={};expenses.forEach(x=>m[x.category||'Other']=(m[x.category||'Other']||0)+Number(x.amount||0));return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function byMonth(){const m={};tx.filter(x=>x.type==='income'||x.type==='expense').forEach(x=>{const k=(x.date||'').slice(0,7)||'Unknown';m[k]=(m[k]||0)+(x.type==='income'?Number(x.amount||0):-Number(x.amount||0))});return Object.entries(m).sort()}
function cashHistory(){let bal=0;const rows=[...tx].filter(x=>x.type==='income'||x.type==='expense'||x.type==='opening').sort((a,b)=>(a.date||'').localeCompare(b.date||''));let peak=0,peakDate='—',lowest=0,lowDate='—';rows.forEach(x=>{if(x.type==='opening')bal=Number(x.amount||0);else bal+=x.type==='income'?Number(x.amount||0):-Number(x.amount||0);if(bal>peak){peak=bal;peakDate=x.date}if(bal<lowest){lowest=bal;lowDate=x.date}});return {peak,peakDate,lowest,lowDate,current:accounts.length?Number(accounts[0].balance||0):0}}
function weekdayStats(){const m={Sun:0,Mon:0,Tue:0,Wed:0,Thu:0,Fri:0,Sat:0};expenses.forEach(x=>{const d=new Date((x.date||'')+'T12:00:00');if(!isNaN(d))m[d.toLocaleDateString('en-US',{weekday:'short'})]+=Number(x.amount||0)});return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function streak(){const days=[...new Set(expenses.map(x=>x.date).filter(Boolean))].sort();if(!days.length)return 0;let best=1,cur=1;for(let i=1;i<days.length;i++){const a=new Date(days[i-1]),b=new Date(days[i]);const diff=(b-a)/86400000;if(diff===1)cur++;else cur=1;best=Math.max(best,cur)}return best}
function personality(top,totalExp){if(!totalExp)return ['🕵️','The Observer','Start recording a few expenses and I’ll figure out your spending personality.'];const pct=top?top[1]/totalExp*100:0;if(top&&/food/i.test(top[0])&&pct>=40)return ['🍜','The Foodie','Food is currently running the show. Your wallet may be saying “one more meal.”'];if(top&&/transport/i.test(top[0])&&pct>=30)return ['🚌','The Commuter','A noticeable chunk of your money is literally going places.'];if(top&&/business/i.test(top[0])&&pct>=25)return ['🏗️','The Builder','Your spending is helping build something. Keep an eye on whether the return follows.'];if(top&&/saving/i.test(top[0])&&pct>=20)return ['🌱','The Gardener','You are planting money instead of eating it. Future-you approves.'];if(debtPayments.length>=3)return ['🛡️','The Debt Slayer','You are actively attacking your debts. Keep the pressure on.'];return ['🧭','The Strategist','No single category dominates too hard. You’re spreading your spending around.']}
function render(){const totalExp=sum(expenses),totalInc=sum(income),net=totalInc-totalExp,top=byCategory()[0],cats=byCategory(),months=byMonth(),week=weekdayStats(),cash=cashHistory(),person=personality(top,totalExp),noSpendDays=new Set(expenses.map(x=>x.date)).size,paid=sum(debtPayments),remaining=debts.filter(d=>Number(d.balance)>0).reduce((s,d)=>s+Number(d.balance||0),0),original=debts.reduce((s,d)=>s+Number(d.original||0),0),debtPct=original?Math.min(100,paid/original*100):0;
const avg=expenses.length?totalExp/expenses.length:0;const biggest=[...expenses].sort((a,b)=>Number(b.amount)-Number(a.amount))[0];const peakMonth=months.length?months.reduce((a,b)=>b[1]>a[1]?b:a):null;
let html=`<div class="cards"><div class="card"><div class="label">Total Spent</div><div class="value negative">${money(totalExp)}</div></div><div class="card"><div class="label">Average Expense</div><div class="value">${money(avg)}</div></div><div class="card"><div class="label">Peak Cash</div><div class="value positive">${money(cash.peak)}</div><div class="muted">${esc(cash.peakDate)}</div></div><div class="card"><div class="label">Debt Remaining</div><div class="value warning">${money(remaining)}</div></div></div>`;
html+=`<div class="grid"><section class="section"><div class="head"><h2>🏆 Where does your money go?</h2></div><div class="body">${cats.length?cats.slice(0,8).map(([n,v],i)=>{const pct=totalExp?v/totalExp*100:0;return `<div class="bar"><div class="bar-name">${i+1}. ${esc(n)}</div><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><div class="bar-num">${money(v)}</div></div>`}).join(''):'<div class="empty">No expenses yet.</div>'}</div></section>`;
html+=`<section class="section"><div class="head"><h2>🎭 Your spending personality</h2></div><div class="body"><div class="emoji">${person[0]}</div><div class="hero">${person[1]}</div><div class="muted">${person[2]}</div>${top?`<div class="insight"><strong>Biggest category:</strong> ${esc(top[0])} · ${money(top[1])} (${(top[1]/totalExp*100).toFixed(0)}%)</div>`:''}${biggest?`<div class="insight"><strong>Biggest single expense:</strong> ${money(biggest.amount)} for ${esc(biggest.category||'Other')} on ${esc(biggest.date)}</div>`:''}</div></section></div>`;
html+=`<div class="grid"><section class="section"><div class="head"><h2>📅 When does money move?</h2></div><div class="body"><div class="muted">Expense ranking by day of the week</div>${week.map(([d,v])=>`<div class="bar"><div class="bar-name">${d}</div><div class="bar-track"><div class="bar-fill" style="width:${totalExp?v/Math.max(...week.map(x=>x[1]),1)*100:0}%"></div></div><div class="bar-num">${money(v)}</div></div>`).join('')}<div class="insight">💡 Your highest-spending weekday is <strong>${week[0][0]}</strong> at ${money(week[0][1])}.</div></div></section>`;
html+=`<section class="section"><div class="head"><h2>📈 Peak money &amp; momentum</h2></div><div class="body"><div class="rank"><span>Highest recorded cash</span><strong>${money(cash.peak)}</strong></div><div class="rank"><span>Peak date</span><strong>${esc(cash.peakDate)}</strong></div><div class="rank"><span>Lowest recorded cash</span><strong>${money(cash.lowest)}</strong></div><div class="rank"><span>Longest spending streak</span><strong>${streak()} day${streak()===1?'':'s'}</strong></div><div class="rank"><span>Days with expenses</span><strong>${noSpendDays}</strong></div></div></section></div>`;
html+=`<section class="section"><div class="head"><h2>💳 Debt progress</h2></div><div class="body">${original?`<div class="balance-row" style="display:flex;justify-content:space-between"><span>Paid: ${money(paid)}</span><strong>${debtPct.toFixed(0)}%</strong></div><div class="meter"><span style="width:${debtPct}%"></span></div><div class="muted">${money(remaining)} remaining across ${debts.filter(d=>Number(d.balance)>0).length} active debt${debts.filter(d=>Number(d.balance)>0).length===1?'':'s'}.</div>`:'<div class="empty">No debt data yet. Add a debt and your progress will appear here.</div>'}</div></section>`;
html+=`<section class="section"><div class="head"><h2>🔎 Quick detective notes</h2></div><div class="body"><div class="insight">${net>=0?'🟢 So far, income is ahead of recorded expenses by '+money(net)+'.':'🔴 Recorded expenses are ahead of income by '+money(Math.abs(net))+'.'}</div>${peakMonth?`<div class="insight">📆 Your strongest net month so far is <strong>${esc(peakMonth[0])}</strong> with ${money(peakMonth[1])} net cash flow.</div>`:''}<div class="insight">🧪 Statistics are based only on what you have entered. Missing transactions can make a month look suspiciously perfect.</div></div></section>`;
document.getElementById('app').innerHTML=html}
render();
</script>
</body></html>
