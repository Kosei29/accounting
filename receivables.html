<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Receivables · Accounting</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#0b1220;color:#e5e7eb}.wrap{max-width:1100px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.title{font-size:24px;font-weight:800}.sub,.meta{color:#64748b;font-size:12px}.btn{border:0;background:#3b82f6;color:white;padding:10px 14px;border-radius:9px;cursor:pointer;font-weight:650}.btn.secondary{background:#1e293b;color:#cbd5e1}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}.card,.section,.loan{background:#111a2a;border:1px solid #243047;border-radius:14px}.card{padding:18px}.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#94a3b8}.value{font-size:25px;font-weight:750;margin-top:7px}.positive{color:#4ade80}.warning{color:#fbbf24}.section{overflow:hidden;margin-bottom:18px}.head{padding:17px 19px;border-bottom:1px solid #243047;display:flex;justify-content:space-between;align-items:center}.head h2{font-size:15px;margin:0}.list{padding:15px;display:grid;gap:10px}.loan{padding:16px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.name{font-weight:700;font-size:16px}.amount{font-size:20px;margin-top:12px}.bar{height:9px;background:#1f2937;border-radius:99px;overflow:hidden;margin:12px 0}.bar span{display:block;height:100%;background:#60a5fa}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}.table{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 15px;border-bottom:1px solid #202b3e;font-size:13px;white-space:nowrap}th{font-size:11px;color:#64748b;text-transform:uppercase}.modal-bg{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:20px}.modal{width:min(520px,100%);background:#111a2a;border:1px solid #2b3952;border-radius:16px;padding:22px}.form{display:grid;gap:13px}.form label{font-size:12px;color:#94a3b8}.form input,.form select{width:100%;margin-top:6px;background:#0b1220;color:white;border:1px solid #2b3952;border-radius:9px;padding:11px}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}.note{font-size:12px;color:#64748b;line-height:1.5}.empty{padding:28px;text-align:center;color:#64748b}@media(max-width:700px){.cards{grid-template-columns:1fr}.wrap{padding:18px}.top{align-items:flex-start;flex-direction:column}}a{color:#93c5fd;text-decoration:none}</style></head><body><div class="wrap"><div class="top"><div><div class="title">Receivables</div><div class="sub">Money owed to you — separate from expenses and your own debts.</div></div><div><a class="btn secondary" href="./">← Accounting</a> <button class="btn" onclick="openLoan()">+ New Receivable</button></div></div><div class="cards"><div class="card"><div class="label">Owed to Me</div><div class="value warning" id="total">₱0</div></div><div class="card"><div class="label">People Owing</div><div class="value" id="active">0</div></div><div class="card"><div class="label">Collected</div><div class="value positive" id="collected">₱0</div></div></div><div class="section"><div class="head"><h2>People Who Owe You</h2><span class="sub">Receivables</span></div><div class="list" id="list"></div></div><div class="section"><div class="head"><h2>Receivable Activity</h2><span class="sub">This is a separate ledger for now</span></div><div class="table"><table><thead><tr><th>Date</th><th>Type</th><th>Person</th><th>Account</th><th>Amount</th><th>Details</th></tr></thead><tbody id="activity"></tbody></table></div></div></div><div class="modal-bg" id="bg"><div class="modal" id="modal"></div></div><script>const K='acct_',money=n=>'₱'+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:0,maximumFractionDigits:2}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let accounts=JSON.parse(localStorage.getItem(K+'accounts')||'null')||[{id:'cash',name:'Cash on Hand (Rylle)',type:'Cash',balance:0}],receivables=JSON.parse(localStorage.getItem(K+'receivables')||'[]'),rTx=JSON.parse(localStorage.getItem(K+'receivable_transactions')||'[]');function save(){localStorage.setItem(K+'receivables',JSON.stringify(receivables));localStorage.setItem(K+'receivable_transactions',JSON.stringify(rTx))}function modal(h){document.getElementById('modal').innerHTML=h;document.getElementById('bg').style.display='flex'}function closeModal(){document.getElementById('bg').style.display='none'}function rebuild(){receivables.forEach(r=>r.balance=Math.max(0,+r.original-rTx.filter(t=>t.receivableId===r.id&&t.type==='payment').reduce((s,t)=>s+ +t.amount,0)));save();render()}function render(){let active=receivables.filter(r=>r.balance>0),total=active.reduce((s,r)=>s+r.balance,0),col=receivables.reduce((s,r)=>s+(+r.original-r.balance),0);document.getElementById('total').textContent=money(total);document.getElementById('active').textContent=active.length;document.getElementById('collected').textContent=money(col);document.getElementById('list').innerHTML=receivables.map(r=>{let paid=Math.max(0,r.original-r.balance),pct=r.original?paid/r.original*100:100;return `<div class="loan"><div class="row"><div><div class="name">${esc(r.person)}</div><div class="meta">Lent ${esc(r.date)}${r.dueDate?' · Due '+esc(r.dueDate):''}</div></div><span class="meta">${r.balance>0?'ACTIVE':'PAID'}</span></div><div class="amount">${money(r.balance)} <span class="meta">remaining of ${money(r.original)}</span></div><div class="bar"><span style="width:${Math.min(100,pct)}%"></span></div><div class="meta">Collected: ${money(paid)}${r.notes?' · '+esc(r.notes):''}</div>${r.balance>0?`<div class="actions"><button class="btn" onclick="receive('${r.id}')">Receive Payment</button></div>`:''}</div>`}).join('')||'<div class="empty">No receivables yet.</div>';document.getElementById('activity').innerHTML=rTx.slice().reverse().map(t=>{let r=receivables.find(x=>x.id===t.receivableId);return `<tr><td>${esc(t.date)}</td><td>${t.type==='lend'?'LENT':'RECEIVED'}</td><td>${esc(r?.person||'Unknown')}</td><td>${esc(t.account||'—')}</td><td>${money(t.amount)}</td><td>${esc(t.description||'—')}</td></tr>`}).join('')||'<tr><td colspan="6" class="empty">No receivable activity yet.</td></tr>'}function openLoan(){modal(`<h2>New Receivable</h2><div class="form"><div class="note">Lending is not an expense. This page records the amount that is now owed to you. Your main account balance is intentionally left untouched until receivables are integrated into the main ledger.</div><label>Person<input id="person" placeholder="e.g. Maria"></label><label>Amount Lent<input id="amount" type="number" min="1" step="1"></label><label>Date<input id="date" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label>Account Used<select id="acct">${accounts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></label><label>Due Date <span class="meta">(optional)</span><input id="due" type="date"></label><label>Notes <span class="meta">(optional)</span><input id="notes" placeholder="What was it for?"></label><div class="form-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="lend()">Record Lent Money</button></div></div>`)}function lend(){let person=document.getElementById('person').value.trim(),amt=+document.getElementById('amount').value||0;if(!person||amt<=0)return alert('Enter a person and amount');let id='r'+Date.now();receivables.push({id,person,original:amt,balance:amt,date:document.getElementById('date').value,dueDate:document.getElementById('due').value,notes:document.getElementById('notes').value.trim()});rTx.push({id:'rt'+Date.now(),date:document.getElementById('date').value,type:'lend',receivableId:id,account:document.getElementById('acct').selectedOptions[0].textContent,amount:amt,description:document.getElementById('notes').value.trim()});rebuild();closeModal()}function receive(id){let r=receivables.find(x=>x.id===id);if(!r)return;modal(`<h2>Receive Payment</h2><div class="form"><div class="note">Record all or part of the repayment here. This reduces the receivable; it does not change your main ledger yet.</div><label>Person<input value="${esc(r.person)}" disabled></label><label>Remaining<input value="${money(r.balance)}" disabled></label><label>Amount Received<input id="amount" type="number" min="1" max="${r.balance}" step="1"></label><label>Date<input id="date" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label>Account Received Into<select id="acct">${accounts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></label><label>Notes <span class="meta">(optional)</span><input id="notes" placeholder="e.g. partial repayment"></label><div class="form-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="payment('${id}')">Record Payment</button></div></div>`)}function payment(id){let r=receivables.find(x=>x.id===id),amt=+document.getElementById('amount').value||0;if(!r||amt<=0||amt>r.balance)return alert('Enter a valid payment amount');rTx.push({id:'rt'+Date.now(),date:document.getElementById('date').value,type:'payment',receivableId:id,account:document.getElementById('acct').selectedOptions[0].textContent,amount:amt,description:document.getElementById('notes').value.trim()});rebuild();closeModal()}document.getElementById('bg').onclick=e=>{if(e.target.id==='bg')closeModal()};rebuild();</script></body></html>
