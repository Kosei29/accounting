<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0b1220">
<title>Accounting</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1220;color:#e5e7eb}button,input,select{font:inherit}.app{min-height:100vh;display:flex}.sidebar{width:230px;background:#080d18;border-right:1px solid #1f2937;padding:24px 16px;display:flex;flex-direction:column}.brand{font-size:21px;font-weight:800;padding:4px 10px 28px}.brand span{color:#60a5fa}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#94a3b8;text-align:left;padding:12px 13px;border-radius:10px;cursor:pointer}.nav button:hover,.nav button.active{background:#172033;color:#fff}.side-note{margin-top:auto;color:#64748b;font-size:12px;padding:12px 10px}.main{flex:1;min-width:0}.topbar{height:72px;border-bottom:1px solid #1f2937;display:flex;align-items:center;justify-content:space-between;padding:0 30px}.topbar h1{font-size:20px;margin:0}.status{font-size:12px;color:#94a3b8}.content{padding:30px;max-width:1250px;margin:auto}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}.card{background:#111a2a;border:1px solid #243047;border-radius:14px;padding:20px}.label{color:#94a3b8;font-size:12px;text-transform:uppercase;letter-spacing:.08em}.value{font-size:27px;font-weight:750;margin-top:8px}.positive{color:#4ade80}.negative{color:#fb7185}.warning{color:#fbbf24}.section{background:#111a2a;border:1px solid #243047;border-radius:14px;margin-bottom:20px;overflow:hidden}.section-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid #243047;gap:12px}.section-head h2{font-size:15px;margin:0}.btn{border:0;background:#3b82f6;color:#fff;padding:9px 14px;border-radius:9px;cursor:pointer;font-weight:650}.btn.secondary{background:#1e293b;color:#cbd5e1}.btn.danger{background:#351923;color:#fb7185}.btn.small{padding:7px 10px;font-size:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}.accounts{display:grid;grid-template-columns:1fr;gap:10px;padding:16px}.account,.debt{border:1px solid #253149;background:#0d1524;border-radius:11px;padding:14px}.account-name,.debt-name{font-weight:650}.account-type,.debt-meta{font-size:12px;color:#64748b;margin-top:3px}.account-balance,.debt-balance{font-size:19px;margin-top:12px}.balance-row{display:flex;justify-content:space-between;align-items:center;gap:12px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px 20px;border-bottom:1px solid #202b3e;font-size:13px;white-space:nowrap}th{color:#64748b;font-size:11px;text-transform:uppercase;letter-spacing:.06em}tr:last-child td{border-bottom:0}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700}.income{background:#12301f;color:#4ade80}.expense{background:#351923;color:#fb7185}.transfer{background:#1b2940;color:#60a5fa}.opening{background:#2a2414;color:#fbbf24}.debt-progress{height:7px;background:#1f2937;border-radius:999px;overflow:hidden;margin-top:12px}.debt-progress>span{display:block;height:100%;background:#60a5fa}.empty{padding:28px;color:#64748b;text-align:center}.modal-bg{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:20px}.modal{width:min(520px,100%);background:#111a2a;border:1px solid #2b3952;border-radius:16px;padding:22px;max-height:90vh;overflow:auto}.modal h2{margin:0 0 18px;font-size:18px}.form{display:grid;gap:13px}.form label{font-size:12px;color:#94a3b8}.form input,.form select{width:100%;margin-top:6px;background:#0b1220;color:#fff;border:1px solid #2b3952;border-radius:9px;padding:11px}.form-note{font-size:12px;color:#64748b;line-height:1.5}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}.field-with-action{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}.category-list{display:grid;gap:8px;margin-top:8px}.category-item{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border:1px solid #253149;background:#0d1524;border-radius:9px;font-size:13px}.toast{position:fixed;bottom:20px;right:20px;background:#172033;border:1px solid #334155;padding:12px 16px;border-radius:10px;display:none;font-size:13px;z-index:5}.debt-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:16px}.debt-card{border:1px solid #253149;background:#0d1524;border-radius:11px;padding:16px}.debt-card-top{display:flex;justify-content:space-between;gap:10px}.debt-status{font-size:11px;color:#4ade80}.debt-status.paid{color:#64748b}.debt-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.muted{color:#64748b;font-size:12px;line-height:1.5}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.sidebar{width:190px}.debt-grid{grid-template-columns:1fr}}@media(max-width:650px){.app{display:block}.sidebar{width:100%;height:auto;padding:12px;display:block}.brand{padding:5px 8px 12px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.side-note{display:none}.topbar{padding:0 18px}.content{padding:18px}.cards{grid-template-columns:1fr 1fr}.value{font-size:22px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar"><div class="brand">Accounting<span>.</span></div><nav class="nav">
<button class="active" data-page="dashboard">Dashboard</button><button data-page="accounts">Accounts</button><button data-page="transactions">Transactions</button><button data-page="debts">Debts</button><button data-page="categories">Categories</button>
</nav><div class="side-note">Personal finance &amp; audit ledger<br>PHP · two-user ready</div></aside>
<main class="main"><header class="topbar"><h1 id="pageTitle">Dashboard</h1><div class="status">● Online</div></header><div class="content" id="content"></div></main>
</div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
<script>
const CASH_ID='cash';
const initialCategories=[{name:'Salary',kind:'income'},{name:'Other Income',kind:'income'},{name:'Food',kind:'expense'},{name:'Transportation',kind:'expense'},{name:'Bills',kind:'expense'},{name:'Internet',kind:'expense'},{name:'Phone Load',kind:'expense'},{name:'Household',kind:'expense'},{name:'Shopping',kind:'expense'},{name:'Personal',kind:'expense'},{name:'Health',kind:'expense'},{name:'Education',kind:'expense'},{name:'Entertainment',kind:'expense'},{name:'Gift',kind:'expense'},{name:'Tithe',kind:'expense'},{name:'Insurance',kind:'expense'},{name:'Debt Payment',kind:'expense'},{name:'Loan Payment',kind:'expense'},{name:'Business',kind:'expense'},{name:'Savings',kind:'expense'},{name:'Opening Balance',kind:'opening'},{name:'Transfer',kind:'transfer'},{name:'Other',kind:'expense'}];
const defaultAccounts=[{id:CASH_ID,name:'Cash on Hand (Rylle)',type:'Cash',balance:0}];
let storedAccounts=JSON.parse(localStorage.getItem('acct_accounts')||'null');let accounts=defaultAccounts;if(storedAccounts&&storedAccounts.some(a=>a.name==='Cash on Hand (Rylle)')){const cash=storedAccounts.find(a=>a.name==='Cash on Hand (Rylle)');accounts=[{id:CASH_ID,name:'Cash on Hand (Rylle)',type:'Cash',balance:Number(cash.balance||0)}]}
let transactions=JSON.parse(localStorage.getItem('acct_transactions')||'null')||[];let categories=JSON.parse(localStorage.getItem('acct_categories')||'null')||initialCategories;let debts=JSON.parse(localStorage.getItem('acct_debts')||'null')||[];
const money=n=>'₱'+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:0,maximumFractionDigits:2});
const save=()=>{localStorage.setItem('acct_accounts',JSON.stringify(accounts));localStorage.setItem('acct_transactions',JSON.stringify(transactions));localStorage.setItem('acct_categories',JSON.stringify(categories));localStorage.setItem('acct_debts',JSON.stringify(debts))};
const total=()=>accounts.reduce((s,a)=>s+Number(a.balance||0),0);const totalDebt=()=>debts.filter(d=>Number(d.balance)>0).reduce((s,d)=>s+Number(d.balance||0),0);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const escAttr=s=>esc(s);
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}
function labelType(t){return t==='opening'?'Opening Balance':t[0].toUpperCase()+t.slice(1)}
function setPage(p){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('pageTitle').textContent=labelType(p);({dashboard:renderDashboard,accounts:renderAccounts,transactions:renderTransactions,debts:renderDebts,categories:renderCategories}[p])()}
function renderDashboard(){const inc=transactions.filter(x=>x.type==='income').reduce((s,x)=>s+Number(x.amount),0),exp=transactions.filter(x=>x.type==='expense').reduce((s,x)=>s+Number(x.amount),0),paid=debts.reduce((s,d)=>s+Number(d.original||0)-Number(d.balance||0),0);document.getElementById('content').innerHTML=`<div class="cards"><div class="card"><div class="label">Cash Balance</div><div class="value">${money(total())}</div></div><div class="card"><div class="label">Income</div><div class="value positive">${money(inc)}</div></div><div class="card"><div class="label">Expenses</div><div class="value negative">${money(exp)}</div></div><div class="card"><div class="label">Debt Remaining</div><div class="value ${totalDebt()?'warning':'positive'}">${money(totalDebt())}</div></div></div><div class="grid2"><div class="section"><div class="section-head"><h2>Cash on Hand</h2><button class="btn secondary" onclick="setPage('accounts')">View</button></div><div class="accounts"><div class="account"><div class="account-name">Cash on Hand (Rylle)</div><div class="account-type">Cash</div><div class="account-balance">${money(accounts[0].balance)}</div></div></div></div><div class="section"><div class="section-head"><h2>Debt Snapshot</h2><button class="btn secondary" onclick="setPage('debts')">Manage</button></div>${debtSnapshot()}</div></div><div class="section"><div class="section-head"><h2>Recent Transactions</h2><button class="btn" onclick="openTransaction()">+ Add</button></div>${transactionTable(transactions.slice(-6).reverse())}</div>`}
function debtSnapshot(){if(!debts.length)return '<div class="empty">No debts recorded. Add one from the Debts page.</div>';return `<div class="accounts">${debts.filter(d=>Number(d.balance)>0).slice(0,4).map(d=>`<div class="debt"><div class="balance-row"><div><div class="debt-name">${esc(d.name)}</div><div class="debt-meta">${esc(d.creditor||'No creditor listed')}</div></div><div class="debt-balance">${money(d.balance)}</div></div></div>`).join('')||'<div class="empty">All recorded debts are paid.</div>'}</div>`}
function transactionTable(rows){if(!rows.length)return '<div class="empty">No transactions yet.</div>';return `<div class="table-wrap"><table><thead><tr><th>Date</th><th>Type</th><th>Category</th><th>Details</th><th>Amount</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.date)}</td><td><span class="badge ${escAttr(x.type)}">${labelType(x.type)}</span></td><td>${esc(x.category||'Other')}</td><td>${esc(x.description||'—')}</td><td>${money(x.amount)}</td></tr>`).join('')}</tbody></table></div>`}
function renderAccounts(){document.getElementById('content').innerHTML=`<div class="section"><div class="section-head"><h2>Your Account</h2><button class="btn" onclick="openOpeningBalance()">Opening Balance</button></div><div class="accounts"><div class="account"><div class="balance-row"><div><div class="account-name">Cash on Hand (Rylle)</div><div class="account-type">Cash</div></div><div class="account-balance">${money(accounts[0].balance)}</div></div></div></div></div><div class="section"><div class="section-head"><h2>Account Setup</h2></div><div style="padding:20px" class="muted">The ledger currently uses one account only: <strong style="color:#e5e7eb">Cash on Hand (Rylle)</strong>. We can add other accounts later without changing your transaction history.</div></div>`}
function renderTransactions(){document.getElementById('content').innerHTML=`<div class="section"><div class="section-head"><h2>Transaction Ledger</h2><button class="btn" onclick="openTransaction()">+ Add Transaction</button></div>${transactionTable(transactions.slice().reverse())}</div>`}
function renderDebts(){const outstanding=debts.filter(d=>Number(d.balance)>0),paid=debts.filter(d=>Number(d.balance)<=0);document.getElementById('content').innerHTML=`<div class="cards"><div class="card"><div class="label">Total Debt</div><div class="value warning">${money(totalDebt())}</div></div><div class="card"><div class="label">Active Debts</div><div class="value">${outstanding.length}</div></div><div class="card"><div class="label">Paid Off</div><div class="value positive">${paid.length}</div></div><div class="card"><div class="label">Debt Payments</div><div class="value">${money(transactions.filter(x=>x.debtId).reduce((s,x)=>s+Number(x.amount),0))}</div></div></div><div class="section"><div class="section-head"><div><h2>Your Debts</h2><div class="muted" style="margin-top:4px">Track what you owe without mixing it into your cash balance.</div></div><button class="btn" onclick="openDebt()">+ Add Debt</button></div>${debts.length?`<div class="debt-grid">${debts.map(d=>debtCard(d)).join('')}</div>`:'<div class="empty">No debts recorded yet. Add a debt whenever you owe money.</div>'}</div>`}
function debtCard(d){const original=Number(d.original||0),balance=Math.max(0,Number(d.balance||0)),percent=original?Math.min(100,((original-balance)/original)*100):100;return `<div class="debt-card"><div class="debt-card-top"><div><div class="debt-name">${esc(d.name)}</div><div class="debt-meta">${esc(d.creditor||'No creditor listed')}</div></div><div class="debt-status ${balance<=0?'paid':''}">${balance<=0?'PAID':'ACTIVE'}</div></div><div class="debt-balance">${money(balance)}</div><div class="muted">of ${money(original)} remaining${d.dueDate?' · Due '+esc(d.dueDate):''}</div><div class="debt-progress"><span style="width:${percent}%"></span></div><div class="debt-actions">${balance>0?`<button class="btn" onclick="openTransactionForDebt('${escAttr(d.id)}')">Pay Debt</button>`:''}<button class="btn secondary small" onclick="removeDebt('${escAttr(d.id)}')">Remove</button></div></div>`}
function renderCategories(){const groups=['income','expense','transfer','opening'];document.getElementById('content').innerHTML=`<div class="section"><div class="section-head"><div><h2>Categories</h2><div class="muted" style="margin-top:4px">Category is what the money was for. Transaction Type is what happened to the money.</div></div><button class="btn" onclick="openCategory()">+ Add Category</button></div><div style="padding:16px">${groups.map(k=>`<div style="margin-bottom:18px"><div class="label" style="margin-bottom:8px">${labelType(k)}</div><div class="category-list">${categories.filter(c=>c.kind===k).map(c=>`<div class="category-item"><span>${esc(c.name)}</span>${!initialCategories.some(x=>x.name===c.name)?`<button class="btn danger small" onclick="removeCategory('${escAttr(c.name)}')">Remove</button>`:''}</div>`).join('')}</div></div>`).join('')}</div></div>`}
function openOpeningBalance(){showModal(`<h2>Opening Balance</h2><div class="form"><div class="form-note">This is the money you already had before starting the ledger. It is not income.</div><label>Opening Balance<input id="oAmount" type="number" min="0" step="1" value="${Number(accounts[0].balance||0)}"></label><label>Date<input id="oDate" type="date" value="${new Date().toISOString().slice(0,10)}"></label><div class="form-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveOpeningBalance()">Save Opening Balance</button></div></div>`)}
function saveOpeningBalance(){const amount=Number(document.getElementById('oAmount').value||0),date=document.getElementById('oDate').value;accounts[0].balance=amount;transactions=transactions.filter(x=>x.type!=='opening');transactions.unshift({id:'opening',date,type:'opening',category:'Opening Balance',account:accounts[0].name,amount});save();closeModal();setPage('accounts');toast('Opening balance saved')}
function categoryOptions(type){return categories.filter(c=>c.kind===type).map(c=>`<option value="${escAttr(c.name)}">${esc(c.name)}</option>`).join('')}
function openTransactionForDebt(id){openTransaction(id)}
function openTransaction(preselectedDebtId){const debt=debts.find(d=>d.id===preselectedDebtId);showModal(`<h2>Add Transaction</h2><div class="form"><label>Type<select id="tType" onchange="updateCategoryOptions()"><option value="income">Income</option><option value="expense" selected>Expense</option><option value="transfer">Transfer</option></select></label><label>Date<input id="tDate" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label>Category<div class="field-with-action"><select id="tCategory" onchange="updateDebtField()">${categoryOptions('expense')}</select><button class="btn secondary small" type="button" onclick="openCategory('transaction')">+ Add</button></div></label><div id="debtField"></div><label>Details <span style="color:#64748b">(optional)</span><input id="tDesc" placeholder="e.g. Jeep fare, groceries, salary"></label><label>Account<select id="tAccount">${accounts.map(a=>`<option value="${escAttr(a.name)}">${esc(a.name)}</option>`).join('')}</select></label><label>Amount<input id="tAmount" type="number" min="0" step="1" placeholder="0"></label><div class="form-note">Type tells us what happened to the money. Category tells us what it was for. A Debt Payment also reduces the selected debt.</div><div class="form-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="addTransaction()">Save</button></div></div>`);if(debt){document.getElementById('tCategory').value=categories.some(c=>c.name==='Debt Payment')?'Debt Payment':'Loan Payment';updateDebtField();if(document.getElementById('tDebt'))document.getElementById('tDebt').value=preselectedDebtId}}
function updateCategoryOptions(){const type=document.getElementById('tType').value;document.getElementById('tCategory').innerHTML=categoryOptions(type);updateDebtField()}
function updateDebtField(){const cat=document.getElementById('tCategory').value;const show=cat==='Debt Payment'||cat==='Loan Payment';const holder=document.getElementById('debtField');if(!holder)return;if(!show){holder.innerHTML='';return}const active=debts.filter(d=>Number(d.balance)>0);holder.innerHTML=`<label>Debt<div class="field-with-action"><select id="tDebt"><option value="">Select a debt</option>${active.map(d=>`<option value="${escAttr(d.id)}">${esc(d.name)} — ${money(d.balance)} remaining</option>`).join('')}</select><button class="btn secondary small" type="button" onclick="openDebt('transaction')">+ Add</button></div></label>`}
function addTransaction(){const type=document.getElementById('tType').value,amount=Number(document.getElementById('tAmount').value||0),name=document.getElementById('tAccount').value,category=document.getElementById('tCategory').value;if(!amount)return toast('Enter an amount');const a=accounts.find(x=>x.name===name);if(!a)return;if(type==='income')a.balance+=amount;if(type==='expense')a.balance-=amount;if(type==='transfer')return toast('Transfers need another account and are coming later');let debtId=null;if(category==='Debt Payment'||category==='Loan Payment'){debtId=document.getElementById('tDebt')?.value||null;if(!debtId)return toast('Select the debt being paid');const d=debts.find(x=>x.id===debtId);if(!d)return;if(amount>Number(d.balance))return toast('Payment is greater than the remaining debt');d.balance=Number(d.balance)-amount}transactions.push({id:'t'+Date.now(),date:document.getElementById('tDate').value,type,category,description:document.getElementById('tDesc').value||'',account:name,amount,debtId});save();closeModal();setPage(document.getElementById('pageTitle').textContent.toLowerCase()==='debt'?'debts':document.getElementById('pageTitle').textContent.toLowerCase());toast('Transaction saved')}
function openDebt(returnTo){showModal(`<h2>Add Debt</h2><div class="form"><div class="form-note">Add something you currently owe. When you pay it through a Debt Payment transaction, the remaining balance here will automatically decrease.</div><label>Debt Name<input id="dName" placeholder="e.g. Wi-Fi bill, personal loan"></label><label>Creditor / Who is owed<input id="dCreditor" placeholder="e.g. Company, person, lender"></label><label>Original Amount<input id="dAmount" type="number" min="0" step="1" placeholder="0"></label><label>Due Date <span style="color:#64748b">(optional)</span><input id="dDue" type="date"></label><div class="form-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="addDebt('${returnTo||''}')">Add Debt</button></div></div>`)}
function addDebt(returnTo){const name=document.getElementById('dName').value.trim(),creditor=document.getElementById('dCreditor').value.trim(),amount=Number(document.getElementById('dAmount').value||0),dueDate=document.getElementById('dDue').value;if(!name)return toast('Enter a debt name');if(!amount)return toast('Enter the debt amount');const debt={id:'d'+Date.now(),name,creditor,original:amount,balance:amount,dueDate};debts.push(debt);save();closeModal();if(returnTo==='transaction'){openTransaction(debt.id)}else setPage('debts');toast('Debt added')}
function removeDebt(id){const d=debts.find(x=>x.id===id);if(!d)return;if(transactions.some(x=>x.debtId===id)){return toast('Keep this debt because it has payment history')}if(!confirm('Remove this debt?'))return;debts=debts.filter(x=>x.id!==id);save();renderDebts();toast('Debt removed')}
function openCategory(returnTo){showModal(`<h2>Add Category</h2><div class="form"><div class="form-note">Create your own category. It will appear in the Category dropdown for future transactions.</div><label>Category Name<input id="cName" placeholder="e.g. Rent, Coffee, Freelance"></label><label>Used for<select id="cKind"><option value="expense">Expense</option><option value="income">Income</option></select></label><div class="form-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="addCategory('${returnTo||''}')">Add Category</button></div></div>`)}
function addCategory(returnTo){const name=document.getElementById('cName').value.trim(),kind=document.getElementById('cKind').value;if(!name)return toast('Enter a category name');if(categories.some(c=>c.name.toLowerCase()===name.toLowerCase()))return toast('Category already exists');categories.push({name,kind});save();closeModal();if(returnTo==='transaction'){openTransaction();document.getElementById('tType').value=kind;updateCategoryOptions();document.getElementById('tCategory').value=name;updateDebtField()}else renderCategories();toast('Category added')}
function removeCategory(name){categories=categories.filter(c=>c.name!==name);save();renderCategories();toast('Category removed')}
function showModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalBg').style.display='flex'}function closeModal(){document.getElementById('modalBg').style.display='none'}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>setPage(b.dataset.page));document.getElementById('modalBg').onclick=e=>{if(e.target.id==='modalBg')closeModal()};save();renderDashboard();
</script>
</body>
</html>
