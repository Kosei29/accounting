<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1220">
  <title>Accounting</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1220;color:#e5e7eb}button,input,select{font:inherit}.app{min-height:100vh;display:flex}.sidebar{width:230px;background:#080d18;border-right:1px solid #1f2937;padding:24px 16px;display:flex;flex-direction:column}.brand{font-size:21px;font-weight:800;padding:4px 10px 28px}.brand span{color:#60a5fa}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#94a3b8;text-align:left;padding:12px 13px;border-radius:10px;cursor:pointer}.nav button:hover,.nav button.active{background:#172033;color:#fff}.side-note{margin-top:auto;color:#64748b;font-size:12px;padding:12px 10px}.main{flex:1;min-width:0}.topbar{height:72px;border-bottom:1px solid #1f2937;display:flex;align-items:center;justify-content:space-between;padding:0 30px}.topbar h1{font-size:20px;margin:0}.status{font-size:12px;color:#94a3b8}.content{padding:30px;max-width:1250px;margin:auto}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}.card{background:#111a2a;border:1px solid #243047;border-radius:14px;padding:20px}.label{color:#94a3b8;font-size:12px;text-transform:uppercase;letter-spacing:.08em}.value{font-size:27px;font-weight:750;margin-top:8px}.positive{color:#4ade80}.negative{color:#fb7185}.section{background:#111a2a;border:1px solid #243047;border-radius:14px;margin-bottom:20px;overflow:hidden}.section-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid #243047}.section-head h2{font-size:15px;margin:0}.btn{border:0;background:#3b82f6;color:#fff;padding:9px 14px;border-radius:9px;cursor:pointer;font-weight:650}.btn.secondary{background:#1e293b;color:#cbd5e1}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}.accounts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:16px}.account{border:1px solid #253149;background:#0d1524;border-radius:11px;padding:14px}.account-name{font-weight:650}.account-type{font-size:12px;color:#64748b;margin-top:3px}.account-balance{font-size:19px;margin-top:12px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px 20px;border-bottom:1px solid #202b3e;font-size:13px;white-space:nowrap}th{color:#64748b;font-size:11px;text-transform:uppercase;letter-spacing:.06em}tr:last-child td{border-bottom:0}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700}.income{background:#12301f;color:#4ade80}.expense{background:#351923;color:#fb7185}.transfer{background:#1b2940;color:#60a5fa}.empty{padding:28px;color:#64748b;text-align:center}.modal-bg{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:20px}.modal{width:min(520px,100%);background:#111a2a;border:1px solid #2b3952;border-radius:16px;padding:22px}.modal h2{margin:0 0 18px;font-size:18px}.form{display:grid;gap:13px}.form label{font-size:12px;color:#94a3b8}.form input,.form select{width:100%;margin-top:6px;background:#0b1220;color:#fff;border:1px solid #2b3952;border-radius:9px;padding:11px}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}.mobile-menu{display:none}.toast{position:fixed;bottom:20px;right:20px;background:#172033;border:1px solid #334155;padding:12px 16px;border-radius:10px;display:none;font-size:13px}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.sidebar{width:190px}}@media(max-width:650px){.app{display:block}.sidebar{width:100%;height:auto;padding:12px;display:block}.brand{padding:5px 8px 12px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.side-note{display:none}.topbar{padding:0 18px}.content{padding:18px}.cards{grid-template-columns:1fr 1fr}.value{font-size:22px}.accounts{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">Accounting<span>.</span></div>
    <nav class="nav">
      <button class="active" data-page="dashboard">Dashboard</button>
      <button data-page="accounts">Accounts</button>
      <button data-page="transactions">Transactions</button>
    </nav>
    <div class="side-note">Personal finance &amp; audit ledger<br>PHP · two-user ready</div>
  </aside>
  <main class="main">
    <header class="topbar"><h1 id="pageTitle">Dashboard</h1><div class="status">● Online</div></header>
    <div class="content" id="content"></div>
  </main>
</div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<script>
const defaultAccounts=[{id:'cash',name:'Cash',type:'Cash',balance:2000},{id:'bank',name:'Bank',type:'Bank',balance:0},{id:'gcash',name:'GCash',type:'E-Wallet',balance:0},{id:'maya',name:'Maya',type:'E-Wallet',balance:0}];
let accounts=JSON.parse(localStorage.getItem('acct_accounts')||'null')||defaultAccounts;
let transactions=JSON.parse(localStorage.getItem('acct_transactions')||'null')||[];
const money=n=>'₱'+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:0,maximumFractionDigits:2});
const save=()=>{localStorage.setItem('acct_accounts',JSON.stringify(accounts));localStorage.setItem('acct_transactions',JSON.stringify(transactions));};
const total=()=>accounts.reduce((s,a)=>s+Number(a.balance||0),0);
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}
function setPage(p){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('pageTitle').textContent=p[0].toUpperCase()+p.slice(1);({dashboard:renderDashboard,accounts:renderAccounts,transactions:renderTransactions}[p])()}
function renderDashboard(){const inc=transactions.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0),exp=transactions.filter(x=>x.type==='expense').reduce((s,x)=>s+x.amount,0);document.getElementById('content').innerHTML=`<div class="cards"><div class="card"><div class="label">Total Balance</div><div class="value">${money(total())}</div></div><div class="card"><div class="label">Income</div><div class="value positive">${money(inc)}</div></div><div class="card"><div class="label">Expenses</div><div class="value negative">${money(exp)}</div></div><div class="card"><div class="label">Net Cash Flow</div><div class="value ${inc-exp>=0?'positive':'negative'}">${money(inc-exp)}</div></div></div><div class="grid2"><div class="section"><div class="section-head"><h2>Accounts Overview</h2><button class="btn secondary" onclick="setPage('accounts')">View all</button></div><div class="accounts">${accounts.map(a=>`<div class="account"><div class="account-name">${esc(a.name)}</div><div class="account-type">${esc(a.type)}</div><div class="account-balance">${money(a.balance)}</div></div>`).join('')}</div></div><div class="section"><div class="section-head"><h2>Recent Transactions</h2><button class="btn" onclick="openTransaction()">+ Add</button></div>${transactionTable(transactions.slice(-6).reverse())}</div></div>`}
function transactionTable(rows){if(!rows.length)return '<div class="empty">No transactions yet.</div>';return `<div class="table-wrap"><table><thead><tr><th>Date</th><th>Type</th><th>Description</th><th>Account</th><th>Amount</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x.date}</td><td><span class="badge ${x.type}">${x.type}</span></td><td>${esc(x.description)}</td><td>${esc(x.account)}</td><td>${money(x.amount)}</td></tr>`).join('')}</tbody></table></div>`}
function renderAccounts(){document.getElementById('content').innerHTML=`<div class="section"><div class="section-head"><h2>Your Accounts</h2><button class="btn" onclick="openAccount()">+ Add Account</button></div><div class="accounts">${accounts.map(a=>`<div class="account"><div class="account-name">${esc(a.name)}</div><div class="account-type">${esc(a.type)}</div><div class="account-balance">${money(a.balance)}</div></div>`).join('')}</div></div>`}
function renderTransactions(){document.getElementById('content').innerHTML=`<div class="section"><div class="section-head"><h2>Transaction Ledger</h2><button class="btn" onclick="openTransaction()">+ Add Transaction</button></div>${transactionTable(transactions.slice().reverse())}</div>`}
function openAccount(){showModal(`<h2>Add Account</h2><div class="form"><label>Name<input id="aName" placeholder="e.g. Savings"></label><label>Type<select id="aType"><option>Cash</option><option>Bank</option><option>E-Wallet</option><option>Savings</option><option>Credit Card</option><option>Other</option></select></label><label>Opening Balance<input id="aBalance" type="number" min="0" value="0"></label><div class="form-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="addAccount()">Create</button></div></div>`)}
function addAccount(){const name=document.getElementById('aName').value.trim();if(!name)return toast('Enter an account name');accounts.push({id:'a'+Date.now(),name,type:document.getElementById('aType').value,balance:Number(document.getElementById('aBalance').value||0)});save();closeModal();renderAccounts();toast('Account created')}
function openTransaction(){showModal(`<h2>Add Transaction</h2><div class="form"><label>Type<select id="tType"><option value="income">Income</option><option value="expense">Expense</option><option value="transfer">Transfer</option></select></label><label>Date<input id="tDate" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label>Description<input id="tDesc" placeholder="What was this for?"></label><label>Account<select id="tAccount">${accounts.map(a=>`<option>${esc(a.name)}</option>`).join('')}</select></label><label>Amount<input id="tAmount" type="number" min="0" step="0.01" placeholder="0"></label><div class="form-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="addTransaction()">Save</button></div></div>`)}
function addTransaction(){const type=document.getElementById('tType').value,amount=Number(document.getElementById('tAmount').value||0),name=document.getElementById('tAccount').value;if(!amount)return toast('Enter an amount');const a=accounts.find(x=>x.name===name);if(!a)return; a.balance += type==='income'?amount:-amount;transactions.push({date:document.getElementById('tDate').value,type,description:document.getElementById('tDesc').value||'Transaction',account:name,amount});save();closeModal();setPage(document.getElementById('pageTitle').textContent.toLowerCase());toast('Transaction saved')}
function showModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalBg').style.display='flex'}function closeModal(){document.getElementById('modalBg').style.display='none'}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>setPage(b.dataset.page));document.getElementById('modalBg').onclick=e=>{if(e.target.id==='modalBg')closeModal()};renderDashboard();
</script>
</body>
</html>
