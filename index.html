<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accounting</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#0b1220;color:#e5e7eb}button,input,select{font:inherit}.app{min-height:100vh;display:flex}.sidebar{width:230px;background:#080d18;border-right:1px solid #1f2937;padding:24px 16px}.brand{font-size:21px;font-weight:800;padding:4px 10px 25px}.brand span{color:#60a5fa}.nav button{display:block;width:100%;border:0;background:transparent;color:#94a3b8;text-align:left;padding:12px 13px;border-radius:10px;cursor:pointer;margin:3px 0}.nav button:hover,.nav button.active{background:#172033;color:#fff}.main{flex:1;min-width:0}.topbar{height:72px;border-bottom:1px solid #1f2937;display:flex;align-items:center;justify-content:space-between;padding:0 30px}.topbar h1{font-size:20px;margin:0}.status{font-size:12px;color:#94a3b8}.content{padding:30px;max-width:1250px;margin:auto}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}.card,.section{background:#111a2a;border:1px solid #243047;border-radius:14px}.card{padding:20px}.label{color:#94a3b8;font-size:12px;text-transform:uppercase;letter-spacing:.08em}.value{font-size:27px;font-weight:750;margin-top:8px}.positive{color:#4ade80}.negative{color:#fb7185}.warning{color:#fbbf24}.section{margin-bottom:20px;overflow:hidden}.section-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid #243047;gap:12px}.section-head h2{font-size:15px;margin:0}.btn{border:0;background:#3b82f6;color:#fff;padding:9px 14px;border-radius:9px;cursor:pointer;font-weight:650}.btn.secondary{background:#1e293b;color:#cbd5e1}.btn.danger{background:#7f1d1d}.btn.small{padding:7px 10px;font-size:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}.accounts{display:grid;gap:10px;padding:16px}.account,.debt{border:1px solid #253149;background:#0d1524;border-radius:11px;padding:14px}.account-type,.debt-meta,.muted{font-size:12px;color:#64748b}.account-balance,.debt-balance{font-size:19px;margin-top:12px}.balance-row{display:flex;justify-content:space-between;align-items:center;gap:12px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px 16px;border-bottom:1px solid #202b3e;font-size:13px;white-space:nowrap}th{color:#64748b;font-size:11px;text-transform:uppercase;letter-spacing:.06em}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700}.income{background:#12301f;color:#4ade80}.expense{background:#351923;color:#fb7185}.transfer{background:#1b2940;color:#60a5fa}.opening{background:#2a2414;color:#fbbf24}.empty{padding:28px;color:#64748b;text-align:center}.modal-bg{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal{width:min(520px,100%);background:#111a2a;border:1px solid #2b3952;border-radius:16px;padding:22px;max-height:90vh;overflow:auto}.modal h2{margin:0 0 18px;font-size:18px}.form{display:grid;gap:13px}.form label{font-size:12px;color:#94a3b8}.form input,.form select{width:100%;margin-top:6px;background:#0b1220;color:#fff;border:1px solid #2b3952;border-radius:9px;padding:11px}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}.debt-grid,.receivable-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:16px}.debt-card,.receivable-card{border:1px solid #253149;background:#0d1524;border-radius:11px;padding:16px}.debt-card-top,.receivable-top{display:flex;justify-content:space-between}.debt-status,.receivable-status{font-size:11px;color:#4ade80}.debt-status.paid,.receivable-status.paid{color:#64748b}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.bar{height:10px;background:#1f2937;border-radius:99px;overflow:hidden;margin:12px 0}.bar span{display:block;height:100%;background:#60a5fa}.chart{padding:18px 20px}.chartrow{display:grid;grid-template-columns:130px 1fr 80px;align-items:center;gap:10px;margin:12px 0;font-size:12px}.insights{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:16px}.insight{border:1px solid #253149;background:#0d1524;border-radius:11px;padding:14px;line-height:1.5}.toast{position:fixed;right:20px;bottom:20px;background:#1e293b;border:1px solid #334155;color:#fff;padding:12px 15px;border-radius:10px;display:none;z-index:20}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.grid2,.debt-grid,.receivable-grid,.insights{grid-template-columns:1fr}.sidebar{width:190px}}@media(max-width:650px){.app{display:block}.sidebar{width:100%;padding:12px}.brand{padding:5px 8px 12px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.topbar{padding:0 18px}.content{padding:18px}.cards{grid-template-columns:1fr 1fr}.value{font-size:22px}.chartrow{grid-template-columns:90px 1fr 65px}}</style></head><body><div class="app"><aside class="sidebar"><div class="brand">Accounting<span>.</span></div><nav class="nav"><button data-page="dashboard">Dashboard</button><button data-page="accounts">Accounts</button><button data-page="transactions">Transactions</button><button data-page="debts">Debts</button><button data-page="receivables">Receivables</button><button data-page="statistics">Statistics</button><button data-page="categories">Categories</button></nav></aside><main class="main"><header class="topbar"><h1 id="pageTitle">Dashboard</h1><div class="status">● Online</div></header><div class="content" id="content"></div></main></div><div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div><script>
const K='acct_',money=n=>'₱'+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:0,maximumFractionDigits:2}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let accounts=JSON.parse(localStorage.getItem(K+'accounts')||'null')||[{id:'cash',name:'Cash on Hand (Rylle)',type:'Cash',balance:0}],transactions=JSON.parse(localStorage.getItem(K+'transactions')||'[]'),categories=JSON.parse(localStorage.getItem(K+'categories')||'null')||['Salary|income','Other Income|income','Food|expense','Transportation|expense','Bills|expense','Internet|expense','Phone Load|expense','Household|expense','Shopping|expense','Personal|expense','Health|expense','Education|expense','Entertainment|expense','Gift|expense','Tithe|expense','Insurance|expense','Debt Payment|expense','Loan Payment|expense','Business|expense','Savings|expense','Other|expense'].map(x=>{let a=x.split('|');return{name:a[0],kind:a[1]}}),debts=JSON.parse(localStorage.getItem(K+'debts')||'[]'),receivables=JSON.parse(localStorage.getItem(K+'receivables')||'[]'),rTx=JSON.parse(localStorage.getItem(K+'receivable_transactions')||'[]');
if(!accounts.some(a=>a.name==='Cash on Hand (Rylle)'))accounts.unshift({id:'cash',name:'Cash on Hand (Rylle)',type:'Cash',balance:0});
function save(){localStorage.setItem(K+'accounts',JSON.stringify(accounts));localStorage.setItem(K+'transactions',JSON.stringify(transactions));localStorage.setItem(K+'categories',JSON.stringify(categories));localStorage.setItem(K+'debts',JSON.stringify(debts));localStorage.setItem(K+'receivables',JSON.stringify(receivables));localStorage.setItem(K+'receivable_transactions',JSON.stringify(rTx))}
function toast(m){let e=document.getElementById('toast');e.textContent=m;e.style.display='block';clearTimeout(window._toast);window._toast=setTimeout(()=>e.style.display='none',2200)}function total(){return accounts.reduce((s,a)=>s+ +a.balance,0)}function debtTotal(){return debts.reduce((s,d)=>s+Math.max(0,+d.balance),0)}function recTotal(){return receivables.reduce((s,r)=>s+Math.max(0,+r.balance),0)}function modal(h){document.getElementById('modal').innerHTML=h;document.getElementById('modalBg').style.display='flex'}function closeModal(){document.getElementById('modalBg').style.display='none'}
function nav(p){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('pageTitle').textContent=p[0].toUpperCase()+p.slice(1);({dashboard,accounts:accountsPage,transactions:transactionsPage,debts:debtsPage,receivables:receivablesPage,statistics,categories:categoriesPage}[p])()}
function rebuild(){accounts.forEach(a=>a.balance=0);let openings={};transactions.forEach(x=>{if(x.type==='opening')openings[x.account]=x});Object.values(openings).forEach(x=>{let a=accounts.find(a=>a.id===x.account);if(a)a.balance=+x.amount});transactions.filter(x=>x.type!=='opening').forEach(x=>applyTxn(x,1));debts.forEach(d=>d.balance=Math.max(0,+d.original-transactions.filter(x=>x.debtId===d.id&&x.type==='expense').reduce((s,x)=>s+ +x.amount,0)));receivables.forEach(r=>r.balance=Math.max(0,+r.original-rTx.filter(t=>t.receivableId===r.id&&t.type==='payment').reduce((s,t)=>s+ +t.amount,0)));save()}
function applyTxn(x,m){if(x.type==='income'){let a=accounts.find(a=>a.id===x.account);if(a)a.balance+=+x.amount*m}else if(x.type==='expense'){let a=accounts.find(a=>a.id===x.account);if(a)a.balance-=+x.amount*m}else if(x.type==='transfer'){let f=accounts.find(a=>a.id===x.from),t=accounts.find(a=>a.id===x.to);if(f)f.balance-=+x.amount*m;if(t)t.balance+=+x.amount*m}}
function table(r){if(!r.length)return '<div class="empty">No transactions yet.</div>';return '<div class="table-wrap"><table><thead><tr><th>Date</th><th>Type</th><th>Category</th><th>Details</th><th>From / Account</th><th>To</th><th>Amount</th><th>Actions</th></tr></thead><tbody>'+r.map(x=>`<tr><td>${esc(x.date)}</td><td><span class="badge ${x.type}">${x.type}</span></td><td>${esc(x.category||'Transfer')}</td><td>${esc(x.description||'—')}</td><td>${esc(x.type==='transfer'?x.from:x.account)}</td><td>${esc(x.to||'—')}</td><td>${money(x.amount)}</td><td><button class="btn secondary small" onclick="editTxn('${x.id}')">Edit</button> <button class="btn danger small" onclick="deleteTxn('${x.id}')">Delete</button></td></tr>`).join('')+'</tbody></table></div>'}
function dashboard(){let inc=transactions.filter(x=>x.type==='income').reduce((s,x)=>s+ +x.amount,0),exp=transactions.filter(x=>x.type==='expense').reduce((s,x)=>s+ +x.amount,0);document.getElementById('content').innerHTML=`<div class="cards"><div class="card"><div class="label">Total Money</div><div class="value">${money(total())}</div></div><div class="card"><div class="label">Income</div><div class="value positive">${money(inc)}</div></div><div class="card"><div class="label">Expenses</div><div class="value negative">${money(exp)}</div></div><div class="card"><div class="label">Owed to Me</div><div class="value warning">${money(recTotal())}</div></div></div><div class="grid2"><div class="section"><div class="section-head"><h2>Accounts</h2><button class="btn secondary" onclick="nav('accounts')">Manage</button></div><div class="accounts">${accounts.map(a=>`<div class="account"><div class="balance-row"><div><b>${esc(a.name)}</b><div class="account-type">${esc(a.type)}</div></div><div class="account-balance">${money(a.balance)}</div></div></div>`).join('')}</div></div><div class="section"><div class="section-head"><h2>Debt & Receivables</h2></div><div class="accounts"><div class="account"><div class="balance-row"><b>Debt Remaining</b><b class="warning">${money(debtTotal())}</b></div></div><div class="account"><div class="balance-row"><b>Owed to Me</b><b class="positive">${money(recTotal())}</b></div></div></div></div></div><div class="section"><div class="section-head"><h2>Recent Transactions</h2><button class="btn" onclick="openTxn()">+ Add</button></div>${table(transactions.slice().reverse().slice(0,7))}</div>`}
function accountsPage(){document.getElementById('content').innerHTML=`<div class="section"><div class="section-head"><h2>Accounts</h2><button class="btn" onclick="openAccount()">+ Add Account</button></div><div class="accounts">${accounts.map(a=>`<div class="account"><div class="balance-row"><div><b>${esc(a.name)}</b><div class="account-type">${esc(a.type)}</div></div><div class="account-balance">${money(a.balance)}</div></div></div>`).join('')}</div></div><div class="section"><div class="section-head"><h2>Opening Balance</h2><button class="btn secondary" onclick="openOpening()">Set</button></div><div class="accounts muted">Opening balance records money you already had; it is not income.</div></div>`}
function transactionsPage(){document.getElementById('content').innerHTML=`<div class="section"><div class="section-head"><h2>Transaction Ledger</h2><button class="btn" onclick="openTxn()">+ Add Transaction</button></div>${table(transactions.slice().reverse())}</div>`}
function debtsPage(){document.getElementById('content').innerHTML=`<div class="cards"><div class="card"><div class="label">Total Debt</div><div class="value warning">${money(debtTotal())}</div></div><div class="card"><div class="label">Active</div><div class="value">${debts.filter(d=>d.balance>0).length}</div></div><div class="card"><div class="label">Paid Off</div><div class="value positive">${debts.filter(d=>d.balance<=0).length}</div></div><div class="card"><div class="label">Payments</div><div class="value">${money(transactions.filter(x=>x.debtId).reduce((s,x)=>s+ +x.amount,0))}</div></div></div><div class="section"><div class="section-head"><h2>Your Debts</h2><button class="btn" onclick="openDebt()">+ Add Debt</button></div><div class="debt-grid">${debts.map(d=>{let p=d.original?(d.original-d.balance)/d.original*100:100;return `<div class="debt-card"><div class="debt-card-top"><b>${esc(d.name)}</b><span class="debt-status ${d.balance<=0?'paid':''}">${d.balance>0?'ACTIVE':'PAID'}</span></div><div class="debt-balance">${money(d.balance)}</div><div class="debt-meta">of ${money(d.original)} · ${esc(d.creditor||'')}</div><div class="bar"><span style="width:${Math.max(0,Math.min(100,p))}%"></span></div>${d.balance>0?`<div class="actions"><button class="btn" onclick="openTxn('${d.id}')">Pay Debt</button></div>`:''}</div>`}).join('')||'<div class="empty">No debts recorded.</div>'}</div></div>`}
function receivablesPage(){let active=receivables.filter(r=>r.balance>0),col=receivables.reduce((s,r)=>s+(+r.original-r.balance),0);document.getElementById('content').innerHTML=`<div class="cards"><div class="card"><div class="label">Owed to Me</div><div class="value warning">${money(recTotal())}</div></div><div class="card"><div class="label">People Owing</div><div class="value">${active.length}</div></div><div class="card"><div class="label">Collected</div><div class="value positive">${money(col)}</div></div><div class="card"><div class="label">Status</div><div class="value">Receivables</div></div></div><div class="section"><div class="section-head"><h2>People Who Owe You</h2><button class="btn" onclick="openReceivable()">+ New Receivable</button></div><div class="receivable-grid">${receivables.map(r=>{let paid=Math.max(0,r.original-r.balance),pct=r.original?paid/r.original*100:100;return `<div class="receivable-card"><div class="receivable-top"><div><b>${esc(r.person)}</b><div class="debt-meta">Lent ${esc(r.date)}${r.dueDate?' · Due '+esc(r.dueDate):''}</div></div><span class="receivable-status ${r.balance<=0?'paid':''}">${r.balance>0?'ACTIVE':'PAID'}</span></div><div class="debt-balance">${money(r.balance)} <span class="debt-meta">remaining of ${money(r.original)}</span></div><div class="bar"><span style="width:${Math.min(100,pct)}%"></span></div><div class="debt-meta">Collected: ${money(paid)}${r.notes?' · '+esc(r.notes):''}</div>${r.balance>0?`<div class="actions"><button class="btn" onclick="receivePayment('${r.id}')">Receive Payment</button></div>`:''}</div>`}).join('')||'<div class="empty">No receivables yet.</div>'}</div></div><div class="section"><div class="section-head"><h2>Receivable Activity</h2><span class="muted">Separate receivable ledger</span></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Type</th><th>Person</th><th>Account</th><th>Amount</th><th>Details</th></tr></thead><tbody>${rTx.slice().reverse().map(t=>{let r=receivables.find(x=>x.id===t.receivableId);return `<tr><td>${esc(t.date)}</td><td>${t.type==='lend'?'LENT':'RECEIVED'}</td><td>${esc(r?.person||'Unknown')}</td><td>${esc(t.account||'—')}</td><td>${money(t.amount)}</td><td>${esc(t.description||'—')}</td></tr>`}).join('')||'<tr><td colspan="6" class="empty">No receivable activity yet.</td></tr>'}</tbody></table></div></div>`}
function statistics(){let ex=transactions.filter(x=>x.type==='expense'),sum=ex.reduce((s,x)=>s+ +x.amount,0),by={};ex.forEach(x=>by[x.category]=(by[x.category]||0)+ +x.amount);let cats=Object.entries(by).sort((a,b)=>b[1]-a[1]),big=ex.slice().sort((a,b)=>b.amount-a.amount)[0],days={};ex.forEach(x=>days[x.date]=(days[x.date]||0)+ +x.amount);let peak=Object.entries(days).sort((a,b)=>b[1]-a[1])[0],avg=ex.length?sum/ex.length:0,person=cats[0]?.[0]==='Food'?'The Foodie':cats[0]?.[0]==='Transportation'?'The Commuter':ex.length?'The Strategist':'The Observer';document.getElementById('content').innerHTML=`<div class="cards"><div class="card"><div class="label">Total Spent</div><div class="value negative">${money(sum)}</div></div><div class="card"><div class="label">Average Expense</div><div class="value">${money(avg)}</div></div><div class="card"><div class="label">Biggest Expense</div><div class="value">${money(big?.amount||0)}</div></div><div class="card"><div class="label">Peak Spending Day</div><div class="value">${peak?esc(peak[0]):'—'}</div></div></div><div class="section"><div class="section-head"><h2>Spending by Category</h2></div><div class="chart">${cats.slice(0,10).map(([c,v])=>`<div class="chartrow"><span>${esc(c)}</span><div class="bar"><span style="width:${sum?v/sum*100:0}%"></span></div><b>${money(v)}</b></div>`).join('')||'<div class="empty">No spending data yet.</div>'}</div></div><div class="section"><div class="section-head"><h2>Fun Insights</h2></div><div class="insights"><div class="insight"><b>Spending personality</b>${person}</div><div class="insight"><b>Biggest hit</b>${big?esc(big.description||big.category):'Nothing yet'}</div><div class="insight"><b>Peak day</b>${peak?money(peak[1]):'Nothing yet'}</div></div></div>`}
function categoriesPage(){document.getElementById('content').innerHTML=`<div class="section"><div class="section-head"><h2>Categories</h2><button class="btn" onclick="openCategory()">+ Add Category</button></div><div class="accounts">${categories.map((c,i)=>`<div class="account"><div class="balance-row"><b>${esc(c.name)}</b><span class="account-type">${esc(c.kind)}</span></div></div>`).join('')}</div></div>`}
function openAccount(){modal(`<h2>Add Account</h2><div class="form"><label>Name<input id="an" placeholder="e.g. GoTyme"></label><label>Type<select id="at"><option>Bank</option><option>E-Wallet</option><option>Savings</option><option>Other</option></select></label><div class="form-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="addAccount()">Add</button></div></div>`)}function addAccount(){let n=document.getElementById('an').value.trim();if(!n)return alert('Enter an account name');accounts.push({id:'a'+Date.now(),name:n,type:document.getElementById('at').value,balance:0});save();closeModal();nav('accounts')}
function openOpening(id){modal(`<h2>Set Opening Balance</h2><div class="form"><label>Account<select id="oa">${accounts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></label><label>Amount<input id="om" type="number" min="0" step="1"></label><label>Date<input id="od" type="date" value="${new Date().toISOString().slice(0,10)}"></label><div class="form-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="setOpening()">Save</button></div></div>`)}function setOpening(){let a=document.getElementById('oa').value,amt=+document.getElementById('om').value||0;transactions=transactions.filter(x=>!(x.type==='opening'&&x.account===a));transactions.push({id:'o'+Date.now(),date:document.getElementById('od').value,type:'opening',account:a,amount:amt,description:'Opening Balance'});rebuild();closeModal();nav('accounts')}
function openTxn(debtId=null,existing=null){let x=existing||{},isT=x.type==='transfer';modal(`<h2>${existing?'Edit':'Add'} Transaction</h2><div class="form"><label>Type<select id="tt" onchange="txnType()"><option value="income" ${x.type==='income'?'selected':''}>Income</option><option value="expense" ${x.type==='expense'?'selected':''}>Expense</option><option value="transfer" ${isT?'selected':''}>Transfer</option></select></label><label>Date<input id="td" type="date" value="${x.date||new Date().toISOString().slice(0,10)}"></label><div id="txnFields"></div><div class="form-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveTxn('${existing?.id||''}','${debtId||existing?.debtId||''}')">${existing?'Save Changes':'Save Transaction'}</button></div></div>`);window._txnOld=x;txnType(x)}
function txnType(old={}){let t=document.getElementById('tt').value,el=document.getElementById('txnFields');if(t==='transfer'){el.innerHTML=`<label>From<select id="tf">${accounts.map(a=>`<option value="${a.id}" ${a.id===old.from?'selected':''}>${esc(a.name)}</option>`).join('')}</select></label><label>To<select id="tx"><option value="">Select destination</option>${accounts.map(a=>`<option value="${a.id}" ${a.id===old.to?'selected':''}>${esc(a.name)}</option>`).join('')}</select></label><label>Amount<input id="ta" type="number" min="1" step="1" value="${old.amount||''}"></label><label>Purpose / Note<input id="tdesc" value="${esc(old.description||'')}"></label>`}else{let kind=t==='income'?'income':'expense',opts=categories.filter(c=>c.kind===kind);el.innerHTML=`<label>Purpose / Category<select id="tc">${opts.map(c=>`<option ${c.name===old.category?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label>${kind==='expense'&&categories.find(c=>c.name===old.category)?.name==='Debt Payment'||old.debtId?`<label>Debt<select id="tdebt">${debts.filter(d=>d.balance>0||d.id===old.debtId).map(d=>`<option value="${d.id}" ${d.id===old.debtId?'selected':''}>${esc(d.name)} — ${money(d.balance)}</option>`).join('')}</select></label>`:''}<label>Account<select id="tacct">${accounts.map(a=>`<option value="${a.id}" ${a.id===old.account?'selected':''}>${esc(a.name)}</option>`).join('')}</select></label><label>Amount<input id="ta" type="number" min="1" step="1" value="${old.amount||''}"></label><label>Details<input id="tdesc" value="${esc(old.description||'')}"></label>`}}
function saveTxn(id,debtId){let t=document.getElementById('tt').value,date=document.getElementById('td').value,amt=+document.getElementById('ta').value||0;if(amt<=0)return alert('Enter an amount');let old=transactions.find(x=>x.id===id);if(old)applyTxn(old,-1);let x={id:id||'t'+Date.now(),date,type:t,amount:amt};if(t==='transfer'){x.from=document.getElementById('tf').value;x.to=document.getElementById('tx').value;x.description=document.getElementById('tdesc').value.trim();if(x.from===x.to)return alert('Choose different accounts')}else{x.account=document.getElementById('tacct').value;x.category=document.getElementById('tc').value;x.description=document.getElementById('tdesc').value.trim();let d=document.getElementById('tdebt');if(d)x.debtId=d.value}if(old)transactions=transactions.filter(q=>q.id!==id);transactions.push(x);rebuild();closeModal();nav('transactions')}
function editTxn(id){let x=transactions.find(x=>x.id===id);if(x)openTxn(null,x)}function deleteTxn(id){let x=transactions.find(x=>x.id===id);if(!x)return;if(!confirm('Delete this transaction? This will recalculate balances.'))return;transactions=transactions.filter(q=>q.id!==id);rebuild();toast('Transaction deleted');nav('transactions')}
function openDebt(){modal(`<h2>Add Debt</h2><div class="form"><label>Name<input id="dn" placeholder="e.g. Wi-Fi Debt"></label><label>Creditor<input id="dc" placeholder="Who do you owe?"></label><label>Original Amount<input id="da" type="number" min="1" step="1"></label><label>Due Date<input id="dd" type="date"></label><div class="form-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="addDebt()">Add Debt</button></div></div>`)}function addDebt(){let n=document.getElementById('dn').value.trim(),amt=+document.getElementById('da').value||0;if(!n||amt<=0)return alert('Enter a name and amount');debts.push({id:'d'+Date.now(),name:n,creditor:document.getElementById('dc').value.trim(),original:amt,balance:amt,dueDate:document.getElementById('dd').value});save();closeModal();nav('debts')}
function openCategory(){modal(`<h2>Add Category</h2><div class="form"><label>Name<input id="cn"></label><label>Type<select id="ck"><option value="expense">Expense</option><option value="income">Income</option></select></label><div class="form-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="addCategory()">Add</button></div></div>`)}function addCategory(){let n=document.getElementById('cn').value.trim();if(!n)return alert('Enter a category');categories.push({name:n,kind:document.getElementById('ck').value});save();closeModal();nav('categories')}
function openReceivable(){modal(`<h2>New Receivable</h2><div class="form"><label>Person<input id="rp" placeholder="Who owes you?"></label><label>Amount Lent<input id="ra" type="number" min="1" step="1"></label><label>Date<input id="rd" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label>Account Used<select id="rac">${accounts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></label><label>Due Date <span class="muted">optional</span><input id="rdue" type="date"></label><label>Notes <span class="muted">optional</span><input id="rn"></label><div class="form-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="lend()">Record Lent Money</button></div></div>`)}function lend(){let person=document.getElementById('rp').value.trim(),amt=+document.getElementById('ra').value||0;if(!person||amt<=0)return alert('Enter a person and amount');let id='r'+Date.now(),acct=document.getElementById('rac').selectedOptions[0].textContent;receivables.push({id,person,original:amt,balance:amt,date:document.getElementById('rd').value,dueDate:document.getElementById('rdue').value,notes:document.getElementById('rn').value.trim()});rTx.push({id:'rt'+Date.now(),date:document.getElementById('rd').value,type:'lend',receivableId:id,account:acct,amount:amt,description:document.getElementById('rn').value.trim()});save();closeModal();nav('receivables')}
function receivePayment(id){let r=receivables.find(x=>x.id===id);if(!r)return;modal(`<h2>Receive Payment</h2><div class="form"><label>Person<input value="${esc(r.person)}" disabled></label><label>Remaining<input value="${money(r.balance)}" disabled></label><label>Amount Received<input id="pa" type="number" min="1" max="${r.balance}" step="1"></label><label>Date<input id="pd" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label>Account Received Into<select id="pac">${accounts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></label><label>Notes<input id="pn"></label><div class="form-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="recordPayment('${id}')">Record Payment</button></div></div>`)}function recordPayment(id){let r=receivables.find(x=>x.id===id),amt=+document.getElementById('pa').value||0;if(!r||amt<=0||amt>r.balance)return alert('Enter a valid payment amount');rTx.push({id:'rt'+Date.now(),date:document.getElementById('pd').value,type:'payment',receivableId:id,account:document.getElementById('pac').selectedOptions[0].textContent,amount:amt,description:document.getElementById('pn').value.trim()});save();closeModal();nav('receivables')}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.page)));document.getElementById('modalBg').onclick=e=>{if(e.target.id==='modalBg')closeModal()};rebuild();nav('dashboard');
</script></body></html>
