<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>Accounting</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#0b1220;color:#e5e7eb}button,input,select{font:inherit}.app{min-height:100vh;display:flex}.sidebar{width:230px;background:#080d18;border-right:1px solid #1f2937;padding:24px 16px}.brand{font-size:21px;font-weight:800;padding:4px 10px 25px}.brand span{color:#60a5fa}.nav button{display:block;width:100%;border:0;background:transparent;color:#94a3b8;text-align:left;padding:12px 13px;border-radius:10px;cursor:pointer;margin:3px 0}.nav button:hover,.nav button.active{background:#172033;color:#fff}.main{flex:1;min-width:0}.topbar{height:72px;border-bottom:1px solid #1f2937;display:flex;align-items:center;justify-content:space-between;padding:0 30px}.topbar h1{font-size:20px;margin:0}.status{font-size:12px;color:#94a3b8}.content{padding:30px;max-width:1250px;margin:auto}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}.card,.section{background:#111a2a;border:1px solid #243047;border-radius:14px}.card{padding:20px}.label{color:#94a3b8;font-size:12px;text-transform:uppercase;letter-spacing:.08em}.value{font-size:27px;font-weight:750;margin-top:8px}.positive{color:#4ade80}.negative{color:#fb7185}.warning{color:#fbbf24}.section{margin-bottom:20px;overflow:hidden}.section-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid #243047;gap:12px}.section-head h2{font-size:15px;margin:0}.btn{border:0;background:#3b82f6;color:#fff;padding:9px 14px;border-radius:9px;cursor:pointer;font-weight:650}.btn.secondary{background:#1e293b;color:#cbd5e1}.btn.danger{background:#7f1d1d}.btn.small{padding:7px 10px;font-size:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}.accounts{display:grid;gap:10px;padding:16px}.account,.debt{border:1px solid #253149;background:#0d1524;border-radius:11px;padding:14px}.account-name,.debt-name{font-weight:650}.account-type,.debt-meta,.muted{font-size:12px;color:#64748b}.account-balance,.debt-balance{font-size:19px;margin-top:12px}.balance-row{display:flex;justify-content:space-between;align-items:center;gap:12px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px 16px;border-bottom:1px solid #202b3e;font-size:13px;white-space:nowrap}th{color:#64748b;font-size:11px;text-transform:uppercase;letter-spacing:.06em}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700}.income{background:#12301f;color:#4ade80}.expense{background:#351923;color:#fb7185}.transfer{background:#1b2940;color:#60a5fa}.opening{background:#2a2414;color:#fbbf24}.empty{padding:28px;color:#64748b;text-align:center}.modal-bg{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal{width:min(520px,100%);background:#111a2a;border:1px solid #2b3952;border-radius:16px;padding:22px;max-height:90vh;overflow:auto}.modal h2{margin:0 0 18px;font-size:18px}.form{display:grid;gap:13px}.form label{font-size:12px;color:#94a3b8}.form input,.form select{width:100%;margin-top:6px;background:#0b1220;color:#fff;border:1px solid #2b3952;border-radius:9px;padding:11px}.form-note{font-size:12px;color:#64748b;line-height:1.5}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}.field-with-action{display:grid;grid-template-columns:1fr auto;gap:8px}.debt-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:16px}.debt-card{border:1px solid #253149;background:#0d1524;border-radius:11px;padding:16px}.debt-card-top{display:flex;justify-content:space-between}.debt-status{font-size:11px;color:#4ade80}.debt-status.paid{color:#64748b}.debt-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.chart{padding:18px 20px}.chartrow{display:grid;grid-template-columns:130px 1fr 80px;align-items:center;gap:10px;margin:12px 0;font-size:12px}.bar{height:10px;background:#1f2937;border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;background:#60a5fa}.insights{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:16px}.insight{border:1px solid #253149;background:#0d1524;border-radius:11px;padding:14px;line-height:1.5}.insight b{display:block;margin-bottom:5px}.toast{position:fixed;right:20px;bottom:20px;background:#1e293b;border:1px solid #334155;color:#fff;padding:12px 15px;border-radius:10px;display:none;z-index:20;box-shadow:0 8px 30px #0006}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.debt-grid,.insights{grid-template-columns:1fr}.sidebar{width:190px}}@media(max-width:650px){.app{display:block}.sidebar{width:100%;padding:12px}.brand{padding:5px 8px 12px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.topbar{padding:0 18px}.content{padding:18px}.cards{grid-template-columns:1fr 1fr}.value{font-size:22px}.chartrow{grid-template-columns:90px 1fr 65px}}</style></head><body><div class="app"><aside class="sidebar"><div class="brand">Accounting<span>.</span></div><nav class="nav"><button data-page="dashboard">Dashboard</button><button data-page="accounts">Accounts</button><button data-page="transactions">Transactions</button><button data-page="debts">Debts</button><button data-page="statistics">Statistics</button><button data-page="categories">Categories</button></nav></aside><main class="main"><header class="topbar"><h1 id="pageTitle">Dashboard</h1><div class="status">● Online</div></header><div class="content" id="content"></div></main></div><div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div><script>
const K='acct_',money=n=>'₱'+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:0,maximumFractionDigits:2}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let accounts=JSON.parse(localStorage.getItem(K+'accounts')||'null')||[{id:'cash',name:'Cash on Hand (Rylle)',type:'Cash',balance:0}],transactions=JSON.parse(localStorage.getItem(K+'transactions')||'[]'),categories=JSON.parse(localStorage.getItem(K+'categories')||'null')||['Salary|income','Other Income|income','Food|expense','Transportation|expense','Bills|expense','Internet|expense','Phone Load|expense','Household|expense','Shopping|expense','Personal|expense','Health|expense','Education|expense','Entertainment|expense','Gift|expense','Tithe|expense','Insurance|expense','Debt Payment|expense','Loan Payment|expense','Business|expense','Savings|expense','Other|expense'].map(x=>{let a=x.split('|');return{name:a[0],kind:a[1]}}),debts=JSON.parse(localStorage.getItem(K+'debts')||'[]');
if(!accounts.some(a=>a.name==='Cash on Hand (Rylle)'))accounts.unshift({id:'cash',name:'Cash on Hand (Rylle)',type:'Cash',balance:0});
function save(){localStorage.setItem(K+'accounts',JSON.stringify(accounts));localStorage.setItem(K+'transactions',JSON.stringify(transactions));localStorage.setItem(K+'categories',JSON.stringify(categories));localStorage.setItem(K+'debts',JSON.stringify(debts))}
function toast(m){let e=document.getElementById('toast');e.textContent=m;e.style.display='block';clearTimeout(window._toast);window._toast=setTimeout(()=>e.style.display='none',2200)}
function total(){return accounts.reduce((s,a)=>s+ +a.balance,0)}function debtTotal(){return debts.reduce((s,d)=>s+Math.max(0,+d.balance),0)}function modal(h){document.getElementById('modal').innerHTML=h;document.getElementById('modalBg').style.display='flex'}function closeModal(){document.getElementById('modalBg').style.display='none'}
function nav(p){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('pageTitle').textContent=p[0].toUpperCase()+p.slice(1);({dashboard,accounts:accountsPage,transactions:transactionsPage,debts:debtsPage,statistics,categories:categoriesPage}[p])()}
function table(r){if(!r.length)return '<div class="empty">No transactions yet.</div>';return '<div class="table-wrap"><table><thead><tr><th>Date</th><th>Type</th><th>Category</th><th>Details</th><th>From / Account</th><th>To</th><th>Amount</th><th>Actions</th></tr></thead><tbody>'+r.map(x=>`<tr><td>${esc(x.date)}</td><td><span class="badge ${x.type}">${x.type}</span></td><td>${esc(x.category||'Transfer')}</td><td>${esc(x.description||'—')}</td><td>${esc(x.type==='transfer'?x.from:x.account)}</td><td>${esc(x.to||'—')}</td><td>${money(x.amount)}</td><td><button class="btn secondary small" onclick="editTxn('${x.id}')">Edit</button> <button class="btn danger small" onclick="deleteTxn('${x.id}')">Delete</button></td></tr>`).join('')+'</tbody></table></div>'}
function dashboard(){let inc=transactions.filter(x=>x.type==='income').reduce((s,x)=>s+ +x.amount,0),exp=transactions.filter(x=>x.type==='expense').reduce((s,x)=>s+ +x.amount,0);document.getElementById('content').innerHTML=`<div class="cards"><div class="card"><div class="label">Total Money</div><div class="value">${money(total())}</div></div><div class="card"><div class="label">Income</div><div class="value positive">${money(inc)}</div></div><div class="card"><div class="label">Expenses</div><div class="value negative">${money(exp)}</div></div><div class="card"><div class="label">Debt Remaining</div><div class="value warning">${money(debtTotal())}</div></div></div><div class="grid2"><div class="section"><div class="section-head"><h2>Accounts</h2><button class="btn secondary" onclick="nav('accounts')">Manage</button></div><div class="accounts">${accounts.map(a=>`<div class="account"><div class="balance-row"><div><div class="account-name">${esc(a.name)}</div><div class="account-type">${esc(a.type)}</div></div><div class="account-balance">${money(a.balance)}</div></div></div>`).join('')}</div></div><div class="section"><div class="section-head"><h2>Debt Snapshot</h2><button class="btn secondary" onclick="nav('debts')">Manage</button></div><div class="accounts">${debts.filter(d=>d.balance>0).slice(0,4).map(d=>`<div class="debt"><div class="balance-row"><b>${esc(d.name)}</b><b>${money(d.balance)}</b></div><div class="debt-meta">${esc(d.creditor||'')}</div></div>`).join('')||'<div class="empty">No active debts.</div>'}</div></div></div><div class="section"><div class="section-head"><h2>Recent Transactions</h2><button class="btn" onclick="openTxn()">+ Add</button></div>${table(transactions.slice().reverse().slice(0,7))}</div>`}
function accountsPage(){document.getElementById('content').innerHTML=`<div class="section"><div class="section-head"><h2>Accounts</h2><button class="btn" onclick="openAccount()">+ Add Account</button></div><div class="accounts">${accounts.map(a=>`<div class="account"><div class="balance-row"><div><b>${esc(a.name)}</b><div class="account-type">${esc(a.type)}</div></div><div class="account-balance">${money(a.balance)}</div></div></div>`).join('')}</div></div><div class="section"><div class="section-head"><h2>Opening Balance</h2><button class="btn secondary" onclick="openOpening()">Set</button></div><div class="accounts muted">Opening balance records money you already had; it is not income.</div></div>`}
function transactionsPage(){document.getElementById('content').innerHTML=`<div class="section"><div class="section-head"><h2>Transaction Ledger</h2><button class="btn" onclick="openTxn()">+ Add Transaction</button></div>${table(transactions.slice().reverse())}</div>`}
function debtsPage(){document.getElementById('content').innerHTML=`<div class="cards"><div class="card"><div class="label">Total Debt</div><div class="value warning">${money(debtTotal())}</div></div><div class="card"><div class="label">Active</div><div class="value">${debts.filter(d=>d.balance>0).length}</div></div><div class="card"><div class="label">Paid Off</div><div class="value positive">${debts.filter(d=>d.balance<=0).length}</div></div><div class="card"><div class="label">Payments</div><div class="value">${money(transactions.filter(x=>x.debtId).reduce((s,x)=>s+ +x.amount,0))}</div></div></div><div class="section"><div class="section-head"><h2>Your Debts</h2><button class="btn" onclick="openDebt()">+ Add Debt</button></div><div class="debt-grid">${debts.map(d=>{let p=d.original?(d.original-d.balance)/d.original*100:100;return `<div class="debt-card"><div class="debt-card-top"><b>${esc(d.name)}</b><span class="debt-status ${d.balance<=0?'paid':''}">${d.balance>0?'ACTIVE':'PAID'}</span></div><div class="debt-balance">${money(d.balance)}</div><div class="debt-meta">of ${money(d.original)} · ${esc(d.creditor||'')}</div><div class="bar"><span style="width:${Math.max(0,Math.min(100,p))}%"></span></div>${d.balance>0?`<div class="debt-actions"><button class="btn" onclick="openTxn('${d.id}')">Pay Debt</button></div>`:''}</div>`}).join('')||'<div class="empty">No debts recorded.</div>'}</div></div>`}
function statistics(){let ex=transactions.filter(x=>x.type==='expense'),totalEx=ex.reduce((s,x)=>s+ +x.amount,0),by={};ex.forEach(x=>by[x.category]=(by[x.category]||0)+ +x.amount);let cats=Object.entries(by).sort((a,b)=>b[1]-a[1]),big=ex.slice().sort((a,b)=>b.amount-a.amount)[0],days={};ex.forEach(x=>days[x.date]=(days[x.date]||0)+ +x.amount);let peak=Object.entries(days).sort((a,b)=>b[1]-a[1])[0];document.getElementById('content').innerHTML=`<div class="cards"><div class="card"><div class="label">Total Spent</div><div class="value negative">${money(totalEx)}</div></div><div class="card"><div class="label">Average Expense</div><div class="value">${money(ex.length?totalEx/ex.length:0)}</div></div><div class="card"><div class="label">Biggest Expense</div><div class="value warning">${money(big?.amount)}</div></div><div class="card"><div class="label">Peak Spending Day</div><div class="value">${peak?money(peak[1]):money(0)}</div></div></div><div class="section"><div class="section-head"><h2>🏆 Where Your Money Goes</h2><span class="muted">Transfers excluded</span></div><div class="chart">${cats.length?cats.slice(0,10).map(([n,v],i)=>`<div class="chartrow"><span>${i+1}. ${esc(n)}</span><div class="bar"><span style="width:${v/cats[0][1]*100}%"></span></div><b>${money(v)}</b></div>`).join(''):'<div class="empty">Add expenses to see your pattern.</div>'}</div></div><div class="insights"><div class="insight"><b>🔥 Biggest hit</b>${big?`${esc(big.category)} · ${money(big.amount)}`:'No data yet.'}</div><div class="insight"><b>📅 Peak day</b>${peak?`${esc(peak[0])} · ${money(peak[1])}`:'No data yet.'}</div><div class="insight"><b>😎 Spending personality</b>${!totalEx?'The Observer — your wallet is still mysterious.':cats[0][0].toLowerCase().includes('food')?'The Foodie — your wallet may be saying “one more meal.”':cats[0][0].toLowerCase().includes('transport')?'The Commuter — your money is literally going places.':'The Strategist — no single category owns the whole wallet.'}</div></div>`}
function categoriesPage(){document.getElementById('content').innerHTML=`<div class="section"><div class="section-head"><div><h2>Categories</h2><div class="muted">What the money was for.</div></div><button class="btn" onclick="openCat()">+ Add Category</button></div><div class="accounts">${categories.map(c=>`<div class="account"><b>${esc(c.name)}</b><span class="muted"> · ${c.kind}</span></div>`).join('')}</div></div>`}
function openAccount(){modal(`<h2>Add Account</h2><div class="form"><label>Account Name<input id="an" placeholder="e.g. GoTyme"></label><label>Type<select id="at"><option>Bank</option><option>E-Wallet</option><option>Savings</option><option>Other</option></select></label><div class="form-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="addAccount()">Add</button></div></div>`)}function addAccount(){let n=document.getElementById('an').value.trim();if(!n)return toast('Enter an account name');if(accounts.some(a=>a.name.toLowerCase()===n.toLowerCase()))return toast('Account already exists');accounts.push({id:'a'+Date.now(),name:n,type:document.getElementById('at').value,balance:0});save();closeModal();accountsPage()}
function openOpening(){modal(`<h2>Opening Balance</h2><div class="form"><label>Account<select id="oa">${accounts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></label><label>Amount<input id="om" type="number" min="0" step="1"></label><label>Date<input id="od" type="date" value="${new Date().toISOString().slice(0,10)}"></label><div class="form-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveOpening()">Save</button></div></div>`)}function saveOpening(){let a=accounts.find(x=>x.id===document.getElementById('oa').value),v=+document.getElementById('om').value||0;transactions=transactions.filter(x=>!(x.type==='opening'&&x.account===a.name));transactions.push({id:'o'+Date.now(),date:document.getElementById('od').value,type:'opening',category:'Opening Balance',account:a.name,amount:v});rebuild();closeModal();accountsPage()}
function txnFields(t,old){let type=t||document.getElementById('tt').value;if(type==='transfer'){document.getElementById('fields').innerHTML=`<label>From Account<select id="from">${accounts.map(a=>`<option value="${a.id}" ${old?.from===a.name?'selected':''}>${esc(a.name)}</option>`).join('')}</select></label><label>To Account<div class="field-with-action"><select id="to">${accounts.map(a=>`<option value="${a.id}" ${old?.to===a.name?'selected':''}>${esc(a.name)}</option>`).join('')}</select><button type="button" class="btn secondary small" onclick="openAccount('txn')">+ Add</button></div></label>`}else{document.getElementById('fields').innerHTML=`<label>Category<div class="field-with-action"><select id="cat">${categories.filter(c=>c.kind===type).map(c=>`<option ${old?.category===c.name?'selected':''}>${esc(c.name)}</option>`).join('')}</select><button type="button" class="btn secondary small" onclick="openCat('txn')">+ Add</button></div></label><label>Account<select id="acct">${accounts.map(a=>`<option value="${a.id}" ${old?.account===a.name?'selected':''}>${esc(a.name)}</option>`).join('')}</select></label><div id="debtpick"></div>`;document.getElementById('cat').onchange=debtField;debtField(old?.debtId)}}
function debtField(selected){let c=document.getElementById('cat'),w=document.getElementById('debtpick');if(!c||!w)return;w.innerHTML=(c.value==='Debt Payment'||c.value==='Loan Payment')?`<label>Debt<select id="debt"><option value="">Select debt</option>${debts.filter(d=>d.balance>0||d.id===selected).map(d=>`<option value="${d.id}" ${d.id===selected?'selected':''}>${esc(d.name)} — ${money(d.balance)}</option>`).join('')}</select></label>`:''}
function openTxn(debtId){modal(`<h2>Add Transaction</h2><div class="form"><label>Type<select id="tt" onchange="txnFields()"><option value="income">Income</option><option value="expense" selected>Expense</option><option value="transfer">Transfer</option></select></label><label>Date<input id="td" type="date" value="${new Date().toISOString().slice(0,10)}"></label><div id="fields"></div><label>Details <span class="muted">(optional)</span><input id="desc" placeholder="e.g. Jeep fare, salary, deposit"></label><label>Amount<input id="amt" type="number" min="0" step="1"></label><div class="form-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveTxn()">Save</button></div></div>`);txnFields();if(debtId){let d=document.getElementById('debt');if(d)d.value=debtId}}
function editTxn(id){let x=transactions.find(t=>t.id===id);if(!x)return;if(x.type==='opening'){modal(`<h2>Edit Opening Balance</h2><div class="form"><label>Account<select id="oa">${accounts.map(a=>`<option value="${a.id}" ${a.name===x.account?'selected':''}>${esc(a.name)}</option>`).join('')}</select></label><label>Amount<input id="om" type="number" min="0" step="1" value="${+x.amount}"></label><label>Date<input id="od" type="date" value="${esc(x.date)}"></label><div class="form-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveOpeningEdit('${id}')">Save Changes</button></div></div>`);return}modal(`<h2>Edit Transaction</h2><div class="form"><label>Type<select id="tt" onchange="txnFields()"><option value="income" ${x.type==='income'?'selected':''}>Income</option><option value="expense" ${x.type==='expense'?'selected':''}>Expense</option><option value="transfer" ${x.type==='transfer'?'selected':''}>Transfer</option></select></label><label>Date<input id="td" type="date" value="${esc(x.date)}"></label><div id="fields"></div><label>Details <span class="muted">(optional)</span><input id="desc" value="${esc(x.description||'')}"></label><label>Amount<input id="amt" type="number" min="0" step="1" value="${+x.amount}"></label><div class="form-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveTxn('${id}')">Save Changes</button></div></div>`);txnFields(x.type,x)}
function rebuild(){accounts.forEach(a=>a.balance=0);let openings={};transactions.filter(x=>x.type==='opening').forEach(x=>openings[x.account]=x);Object.values(openings).forEach(x=>{let a=accounts.find(a=>a.name===x.account);if(a)a.balance=+x.amount});transactions.filter(x=>x.type!=='opening').forEach(x=>{let a;if(x.type==='income'){a=accounts.find(a=>a.name===x.account);if(a)a.balance+=+x.amount}else if(x.type==='expense'){a=accounts.find(a=>a.name===x.account);if(a)a.balance-=+x.amount}else if(x.type==='transfer'){let f=accounts.find(a=>a.name===x.from),t=accounts.find(a=>a.name===x.to);if(f)f.balance-=+x.amount;if(t)t.balance+=+x.amount}});debts.forEach(d=>d.balance=Math.max(0,+d.original-transactions.filter(x=>x.debtId===d.id&&x.type==='expense').reduce((s,x)=>s+ +x.amount,0)));save()}
function saveOpeningEdit(id){let x=transactions.find(t=>t.id===id),a=accounts.find(a=>a.id===document.getElementById('oa').value),v=+document.getElementById('om').value||0;if(!a||v<0)return toast('Enter a valid opening balance');x.account=a.name;x.amount=v;x.date=document.getElementById('od').value;rebuild();closeModal();nav('transactions')}
function saveTxn(id){let old=id?transactions.find(t=>t.id===id):null,t=document.getElementById('tt').value,a=+document.getElementById('amt').value||0;if(!a)return toast('Enter an amount');let n={id:id||'t'+Date.now(),date:document.getElementById('td').value,type:t,description:document.getElementById('desc').value||''};if(t==='transfer'){let f=accounts.find(x=>x.id===document.getElementById('from').value),to=accounts.find(x=>x.id===document.getElementById('to').value);if(!f||!to||f.id===to.id)return toast('Choose different accounts');let base=accounts.map(x=>({...x}));if(old)applyOne(base,old,-1);let bf=base.find(x=>x.name===f.name);if(!bf||a>bf.balance)return toast('Insufficient funds');n.category='Transfer';n.from=f.name;n.to=to.name;n.amount=a}else{let ac=accounts.find(x=>x.id===document.getElementById('acct').value),cat=document.getElementById('cat').value;if(!ac)return toast('Choose an account');let base=accounts.map(x=>({...x}));if(old)applyOne(base,old,-1);let ba=base.find(x=>x.name===ac.name);if(t==='expense'&&a>ba.balance)return toast('Insufficient funds');let did=null;if(t==='expense'&&(cat==='Debt Payment'||cat==='Loan Payment')){did=document.getElementById('debt')?.value;if(!did)return toast('Select the debt being paid');let remaining=debts.find(d=>d.id===did)?.original||0;remaining-=transactions.filter(x=>x.debtId===did&&x.id!==id).reduce((s,x)=>s+ +x.amount,0);if(a>remaining)return toast('Payment exceeds debt')}n.category=cat;n.account=ac.name;n.amount=a;n.debtId=did}if(id)transactions=transactions.map(x=>x.id===id?n:x);else transactions.push(n);rebuild();closeModal();nav('transactions')}
function applyOne(arr,x,dir){if(x.type==='income'){let a=arr.find(a=>a.name===x.account);if(a)a.balance+=dir*+x.amount}else if(x.type==='expense'){let a=arr.find(a=>a.name===x.account);if(a)a.balance-=dir*+x.amount}else if(x.type==='transfer'){let f=arr.find(a=>a.name===x.from),t=arr.find(a=>a.name===x.to);if(f)f.balance-=dir*+x.amount;if(t)t.balance+=dir*+x.amount}}
function deleteTxn(id){let x=transactions.find(t=>t.id===id);if(!x)return;if(!confirm(`Delete this ${x.type} transaction for ${money(x.amount)}?`))return;transactions=transactions.filter(t=>t.id!==id);rebuild();toast('Transaction deleted');nav('transactions')}
function openDebt(){modal(`<h2>Add Debt</h2><div class="form"><div class="form-note">Creating a debt does not change cash. Paying it through a transaction decreases both cash and debt.</div><label>Debt Name<input id="dn" placeholder="e.g. Wi-Fi bill"></label><label>Creditor<input id="dc" placeholder="e.g. RED Fiber"></label><label>Original Amount<input id="da" type="number" min="0" step="1"></label><label>Due Date <span class="muted">(optional)</span><input id="dd" type="date"></label><div class="form-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="addDebt()">Add Debt</button></div></div>`)}function addDebt(){let n=document.getElementById('dn').value.trim(),a=+document.getElementById('da').value||0;if(!n||!a)return toast('Enter debt name and amount');debts.push({id:'d'+Date.now(),name:n,creditor:document.getElementById('dc').value.trim(),original:a,balance:a,dueDate:document.getElementById('dd').value});save();closeModal();debtsPage()}
function openCat(ret){modal(`<h2>Add Category</h2><div class="form"><label>Category Name<input id="cn" placeholder="e.g. Rent, Coffee, Freelance"></label><label>Used for<select id="ck"><option value="expense">Expense</option><option value="income">Income</option></select></label><div class="form-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="addCat('${ret||''}')">Add</button></div></div>`)}function addCat(ret){let n=document.getElementById('cn').value.trim();if(!n)return toast('Enter a category name');if(categories.some(c=>c.name.toLowerCase()===n.toLowerCase()))return toast('Category already exists');categories.push({name:n,kind:document.getElementById('ck').value});save();closeModal();ret==='txn'?openTxn():categoriesPage()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>nav(b.dataset.page));document.getElementById('modalBg').onclick=e=>{if(e.target.id==='modalBg')closeModal()};rebuild();nav('dashboard');
</script></body></html>
